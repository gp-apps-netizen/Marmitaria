<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="mobile-web-app-capable" content="yes">
<title>Administrador Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111214; --s1:#1a1b1e; --s2:#222327; --s3:#2c2d32; --bd:#303137;
  --tx:#ececec; --mu:#9b9ca3; --ac:#f5a524; --acx:#1b1300;
  --ok:#3ecf8e; --er:#ef5350; --info:#4aa3ff; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;padding-bottom:40px}
body.noscroll{overflow:hidden}
h1,h2,.num{font-family:'Space Grotesk',system-ui,sans-serif}
h2{font-size:1.15rem;margin:4px 0 12px}
h3{margin:18px 0 8px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top .brand{flex:1;min-width:0}.top b{font-family:'Space Grotesk';font-size:1.05rem;display:block}.top small{color:var(--mu)}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.btn{background:var(--ac);color:var(--acx);font-weight:600;border-radius:10px;padding:11px 16px;text-align:center}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}
.btn.danger{background:transparent;color:var(--er);border:1px solid var(--er)}
.btn.ok{background:var(--ok);color:#03150d}
.btn.block{width:100%;display:block}.btn:disabled{opacity:.5}
.btn.sm{padding:8px 12px;font-size:.85rem}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);display:grid;place-items:center;flex:none}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}.between{justify-content:space-between}
.muted{color:var(--mu)}.small{font-size:.82rem}.hidden{display:none!important}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;vertical-align:middle}
.b-ok{background:rgba(62,207,142,.15);color:var(--ok)}.b-er{background:rgba(239,83,80,.15);color:var(--er)}
.b-warn{background:rgba(245,165,36,.15);color:var(--ac)}.b-info{background:rgba(74,163,255,.15);color:var(--info)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.kpi .num{font-size:1.4rem;font-weight:700}.kpi small{color:var(--mu);display:block}
.bar-card{width:100%;text-align:left;display:block}
.bar-card .nome{font-family:'Space Grotesk';font-weight:600;font-size:1.05rem}
.seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;padding:8px;border-radius:8px;color:var(--mu);font-size:.85rem}.seg button.on{background:var(--s3);color:var(--tx)}
.seg.apps{margin-bottom:14px}.seg.apps button{padding:8px 2px;font-size:.8rem;font-weight:600;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}.seg.apps button i{font-style:normal;font-size:1.15rem;line-height:1}
#inscBox{margin:0 -16px -40px}#inscBox iframe{display:block;width:100%;border:0;height:calc(100dvh - 150px);min-height:480px;background:transparent}.seg.apps button.on{background:var(--ac);color:var(--acx)}
.center{min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.hero{font-size:52px}
.empty{color:var(--mu);text-align:center;padding:28px 10px}
.link{word-break:break-all;font-size:.85rem;background:var(--s2);border-radius:8px;padding:8px 10px;margin:4px 0 8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--s1);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.uso-item{margin-top:12px}.uso-item .num{font-family:'Space Grotesk';font-size:1.05rem}
.uso-barra{height:8px;background:var(--s3);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.uso-barra i{display:block;height:100%;border-radius:4px;background:var(--ok)}.uso-barra i.warn{background:var(--ac)}.uso-barra i.er{background:var(--er)}
.uso-graf svg{width:100%;height:auto;display:block;margin-top:8px}
.uso-graf .g{stroke:var(--bd);stroke-width:1}.uso-graf .g.lim{stroke:var(--mu);stroke-dasharray:4 3}
.uso-graf .ax{fill:var(--mu);font-size:9px}
.uso-graf .bar{fill:var(--info)}.uso-graf .bar.warn{fill:var(--ac)}.uso-graf .bar.er{fill:var(--er)}.uso-graf .bar.sel{fill:var(--tx)}
.uso-graf .hit{cursor:pointer}
.uso-tab{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}.uso-tab th,.uso-tab td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--bd)}.uso-tab th:first-child,.uso-tab td:first-child{text-align:left}
details summary{cursor:pointer;color:var(--mu)}
#toast{position:fixed;left:16px;right:16px;bottom:20px;margin:0 auto;max-width:480px;background:var(--s3);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .2s;pointer-events:none;opacity:0}
#toast.ok{border-color:var(--ok)}#toast.erro{border-color:var(--er)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Administrador Apps</b><small id="quem">Bares, salões, marmitarias e inscrições</small></div>
  <button class="btn ghost sm hidden" id="btnSair">Sair</button>
</header>
<main>
  <section id="t-login" class="center hidden">
    <div class="hero">🛠️</div>
    <h2>Painel do administrador</h2>
    <p class="muted">Cadastro de bares e salões, mensalidades e bloqueios.</p>
    <div style="width:100%;max-width:340px;text-align:left">
      <label>E-mail</label><input id="lgEmail" type="email" inputmode="email" autocomplete="username">
      <label>Senha</label><input id="lgSenha" type="password" autocomplete="current-password">
      <button class="btn block" id="lgEntrar" style="margin-top:14px">Entrar</button>
    </div>
  </section>

  <section id="t-semacesso" class="center hidden">
    <div class="hero">🔒</div>
    <h2>Área restrita</h2>
    <p class="muted">Este login não é o do administrador do sistema.</p>
    <button class="btn ghost" id="btnTrocar">Trocar conta</button>
  </section>

  <section id="t-painel" class="hidden">
    <div class="seg apps" id="appSeg"><button data-a="bar" class="on"><i>🍺</i>Bares</button><button data-a="salao"><i>✂️</i>Salões</button><button data-a="marmita"><i>🍱</i>Marmitas</button><button data-a="insc"><i>🎟</i>Inscrições</button><button data-a="uso"><i>📊</i>Uso</button></div>
    <div id="usoBox" class="hidden"></div>
    <div id="inscBox" class="hidden"></div>
    <div id="appBox">
    <div class="kpis">
      <div class="kpi"><small id="lAtivos">Bares ativos</small><div class="num" id="kAtivos">0</div></div>
      <div class="kpi"><small>Receita mensal</small><div class="num" id="kReceita">R$ 0</div></div>
      <div class="kpi"><small>Vencidos</small><div class="num" id="kVencidos">0</div></div>
      <div class="kpi"><small>Suspensos</small><div class="num" id="kSuspensos">0</div></div>
    </div>
    <div class="row between" style="margin:2px 2px 0"><p class="small muted" id="kTotal"></p><button class="btn ghost sm" id="btnCobranca">💬 Cobrança</button></div>
    <button class="btn block" id="btnNovo" style="margin:10px 0 4px">+ Novo bar</button>
    <button class="btn ghost block hidden" id="btnTeste" style="margin:8px 0 4px">🧪 Criar meu salão de teste</button>
    <h3 id="hLista">Bares</h3>
    <div class="seg" id="filtro"><button data-f="todos" class="on">Todos</button><button data-f="ativos">Ativos</button><button data-f="vencidos">Vencidos</button><button data-f="suspensos">Suspensos</button></div>
    <div id="lista"></div>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, inMemoryPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, onSnapshot, serverTimestamp, writeBatch, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= CONFIGURAÇÃO ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAeSmdHNn7LTk60DKO3DCGOTvPaNHdzMF4",
  authDomain: "atendimento-bar.firebaseapp.com",
  projectId: "atendimento-bar",
  storageBucket: "atendimento-bar.firebasestorage.app",
  messagingSenderId: "92179047707",
  appId: "1:92179047707:web:08d82fc86c7da2f0215fbe",
  measurementId: "G-NT0H4GQ3V7"
};
const SUPER = "godoygpx@gmail.com";   // único login com acesso a este painel
const VERSAO = "3.2";
/* ================================================ */

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = c => ((c || 0) / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const parseNum = s => { s = String(s ?? "").trim().replace(/\s|R\$/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); return Number(s) || 0; };
const cents = v => Math.round((Number(v) || 0) * 100);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoje = () => iso(new Date());
const fmtDia = s => s ? s.split("-").reverse().join("/") : "—";
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30);
const emailOk = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
/* soma meses mantendo o dia (31/01 + 1 mês → 28 ou 29/02) */
function maisMeses(s, n) {
  const [a, m, d] = (s || hoje()).split("-").map(Number);
  const alvo = new Date(a, m - 1 + n, 1), ult = new Date(alvo.getFullYear(), alvo.getMonth() + 1, 0).getDate();
  alvo.setDate(Math.min(d, ult)); return iso(alvo);
}
const diasAte = s => Math.round((new Date(s + "T12:00") - new Date(hoje() + "T12:00")) / 864e5);

function toast(msg, tipo = "") {
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.className = tipo; t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._t); t._t = setTimeout(() => { t.style.opacity = 0; }, 3200);
}
function abrirModal(html) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`; document.body.appendChild(bg); document.body.classList.add("noscroll");
  const fechar = () => { bg.remove(); if (!$(".modal-bg")) document.body.classList.remove("noscroll"); };
  bg.onclick = e => { if (e.target === bg) fechar(); };
  $$("[data-fechar]", bg).forEach(b => b.onclick = fechar);
  return { el: bg, fechar };
}
function confirmar(msg, ok = "Confirmar", perigo = false) {
  return new Promise(res => {
    const md = abrirModal(`<p style="margin:6px 0 16px">${msg}</p><div class="row"><button class="btn ghost grow" id="nao">Cancelar</button><button class="btn grow ${perigo ? "danger" : ""}" id="sim">${esc(ok)}</button></div>`);
    $("#nao", md.el).onclick = () => { md.fechar(); res(false); };
    $("#sim", md.el).onclick = () => { md.fechar(); res(true); };
  });
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); toast("Copiado", "ok"); }
  catch (e) { prompt("Copie:", txt); }
}
const erroMsg = e => ({
  "auth/invalid-credential": "E-mail ou senha incorretos", "auth/wrong-password": "E-mail ou senha incorretos",
  "auth/user-not-found": "E-mail ou senha incorretos", "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco",
  "auth/invalid-email": "E-mail inválido", "auth/weak-password": "Senha fraca (mínimo 6 caracteres)",
  "permission-denied": "Sem permissão (confira as regras do Firestore)"
}[e.code] || ("Erro: " + (e.code || e.message)));

/* ---------- Tipos de app gerenciados ---------- */
const SALAO_BASE = "https://salao.gpxapps.app.br/";
const TIPOS = {
  bar: {
    col: "bares", users: "usuarios", campo: "barId", nome: "Bar", nomeMin: "bar", plural: "Bares", pluralMin: "bares", o: "o", novo: "Novo", nenhum: "Nenhum", um: "um", do: "do", no: "no", seu: "o seu",
    exemplo: "Ex.: Boteco do Zé", idEx: "boteco-do-ze",
    subs: ["garcons", "produtos", "mesas", "clientes", "pedidos", "contas", "config", "chamados", "comandas", "publico", "delivery", "fotos", "estoque"],
    perda: "cardápio, mesas, pedidos, relatórios, clientes e equipe, e o dono e os garçons perdem o acesso",
  },
  salao: {
    col: "saloes", users: "usuariosSalao", campo: "saloId", nome: "Salão", nomeMin: "salão", plural: "Salões", pluralMin: "salões", o: "o", novo: "Novo", nenhum: "Nenhum", um: "um", do: "do", no: "no", seu: "o seu",
    exemplo: "Ex.: Studio Bella", idEx: "studio-bella",
    subs: ["config", "servicos", "profissionais", "pacotes", "ocupados", "agendamentos", "clientes", "clientePacotes", "privado", "produtos", "vendas", "movimentos"],
    perda: "agenda, clientes, serviços, pacotes, produtos, equipe e relatórios, e o dono perde o acesso",
  },
  marmita: {
    col: "marmitarias", users: "usuariosMarmita", campo: "marmitaId", nome: "Marmitaria", nomeMin: "marmitaria", plural: "Marmitarias", pluralMin: "marmitarias", o: "a", novo: "Nova", nenhum: "Nenhuma", um: "uma", do: "da", no: "na", seu: "a sua",
    exemplo: "Ex.: Marmitaria da Ana", idEx: "marmitaria-da-ana",
    subs: ["produtos", "pedidos", "meta", "privado"],
    perda: "cardápio, pedidos, relatórios e equipe, e o dono e os funcionários perdem o acesso",
    extra: { aberto: false, fazEntrega: true, aceitaRetirada: true, taxaEntrega: 0, freteGratisAcima: 0, pedidoMinimo: 0,
      formas: { dinheiro: true, cartao: true, pix: false, pixMP: false } },
  },
};
const tp = () => TIPOS[S.app];

/* ---------- Links de cada bar ---------- */
const raiz = new URL("../", location.href.split("#")[0].split("?")[0]);
const linksSalao = id => ({
  admin: new URL(`admin/?s=${encodeURIComponent(id)}`, SALAO_BASE).href,
  agenda: new URL(`?s=${encodeURIComponent(id)}`, SALAO_BASE).href,
  suporte: new URL(`admin/?salao=${encodeURIComponent(id)}`, SALAO_BASE).href
});
const MARMITA_BASE = "https://marmita.gpxapps.app.br/";
const linksMarmita = id => ({
  painel: new URL("loja/", MARMITA_BASE).href,
  pedir: new URL(`pedir/?m=${encodeURIComponent(id)}`, MARMITA_BASE).href,
  suporte: new URL(`loja/?m=${encodeURIComponent(id)}`, MARMITA_BASE).href
});
const links = id => ({
  central: new URL("central/", raiz).href,
  garcom: new URL("garcom/", raiz).href,
  cardapio: new URL(`cliente/?b=${encodeURIComponent(id)}`, raiz).href,
  suporte: new URL(`central/?bar=${encodeURIComponent(id)}`, raiz).href
});

/* ---------- Estado ---------- */
const S = { bares: [], saloes: [], marmitas: [], app: "bar", filtro: "todos", unsub: null, unsub2: null, unsub3: null };
const lista = () => S.app === "bar" ? S.bares : S.app === "marmita" ? S.marmitas : S.saloes;

function mostrar(t) {
  $$("main > section").forEach(s => s.classList.add("hidden")); $("#t-" + t).classList.remove("hidden");
  $("#btnSair").classList.toggle("hidden", t === "login");
}

/* ---------- Login ---------- */
const entrar = async () => {
  const email = $("#lgEmail").value.trim().toLowerCase(), senha = $("#lgSenha").value;
  if (!email || !senha) return toast("Informe e-mail e senha", "erro");
  const b = $("#lgEntrar"); b.disabled = true; b.textContent = "Entrando…";
  try { await signInWithEmailAndPassword(auth, email, senha); $("#lgSenha").value = ""; } catch (e) { toast(erroMsg(e), "erro"); }
  b.disabled = false; b.textContent = "Entrar";
};
$("#lgEntrar").onclick = entrar;
$("#lgSenha").onkeydown = e => { if (e.key === "Enter") entrar(); };
$("#btnTrocar").onclick = () => signOut(auth);
$("#btnSair").onclick = async () => { if (await confirmar("Sair do painel neste aparelho?", "Sair")) signOut(auth); };

onAuthStateChanged(auth, u => {
  S.unsub?.(); S.unsub = null; S.unsub2?.(); S.unsub2 = null; S.unsub3?.(); S.unsub3 = null;
  if (!u) return mostrar("login");
  if ((u.email || "").toLowerCase() !== SUPER) return mostrar("semacesso");
  $("#quem").textContent = u.email + " · v" + VERSAO;
  mostrar("painel");
  S.unsub = onSnapshot(collection(db, "bares"), s => {
    S.bares = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
    render();
  }, e => { console.error(e); toast(erroMsg(e), "erro"); });
  setTimeout(carregarInscricoes, 1500);
  S.unsub2 = onSnapshot(collection(db, "saloes"), s => {
    S.saloes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
    render();
  }, e => { console.error(e); toast("Salões: " + erroMsg(e), "erro"); });
  S.unsub3 = onSnapshot(collection(db, "marmitarias"), s => {
    S.marmitas = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
    render();
  }, e => { console.error(e); toast("Marmitarias: " + erroMsg(e), "erro"); });
});

/* ---------- Lista ---------- */
const vencido = b => b.plano !== "proprio" && b.vencimento && diasAte(b.vencimento) < 0;
function situacao(b) {
  if (b.status !== "ativo") return `<span class="badge b-er">Suspenso</span>`;
  if (b.plano === "proprio") return `<span class="badge b-info">Próprio</span>`;
  if (!b.vencimento) return `<span class="badge b-ok">Ativo</span>`;
  const d = diasAte(b.vencimento);
  if (d < 0) return `<span class="badge b-er">Vencido há ${-d} dia${d === -1 ? "" : "s"}</span>`;
  if (d <= 5) return `<span class="badge b-warn">Vence ${d === 0 ? "hoje" : `em ${d} dia${d === 1 ? "" : "s"}`}</span>`;
  return `<span class="badge b-ok">Em dia</span>`;
}
function render() {
  const T = tp(), L0 = lista();
  $("#lAtivos").textContent = `${T.plural} ativos`;
  $("#btnNovo").textContent = `+ ${T.novo} ${T.nomeMin}`;
  $("#hLista").textContent = T.plural;
  $("#btnTeste").classList.toggle("hidden", !(S.app === "salao" && !S.saloes.some(b => (b.donoEmail || "").toLowerCase() === SUPER)));
  const rec = arr => arr.filter(b => b.status === "ativo" && b.plano !== "proprio").reduce((s, b) => s + (b.mensalidade || 0), 0);
  $("#kTotal").textContent = `Receita mensal de todos os apps: ${brl(rec(S.bares) + rec(S.saloes) + rec(S.marmitas) + (INSC.kpis?.receita || 0))}${INSC.kpis?.logado ? "" : " (sem inscrições)"}`;

let appSec;
async function criarLogin(email, senha) {
  appSec = appSec || initializeApp(firebaseConfig, "cadastro");
  const a2 = getAuth(appSec);
  await setPersistence(a2, inMemoryPersistence);
  await createUserWithEmailAndPassword(a2, email, senha);
  await signOut(a2);
}

    if (inp.value.trim() !== b.id) return;
    ok.disabled = true; inp.disabled = true; ok.textContent = "Excluindo…";
    const emails = new Set([b.donoEmail].filter(Boolean));
    try {
      let total = 0;
      for (const n of T.subs) {
        info(`Apagando ${n}…`);
        const snap = await getDocs(collection(db, `${T.col}/${b.id}/${n}`));
        if (n === "garcons") snap.docs.forEach(d => emails.add(d.id));
        for (let i = 0; i < snap.docs.length; i += 400) {
          const bt = writeBatch(db); snap.docs.slice(i, i + 400).forEach(d => bt.delete(d.ref)); await bt.commit();
        }
        total += snap.size;
      }
      info("Removendo acessos da equipe…");
      const us = await getDocs(query(collection(db, T.users), where(T.campo, "==", b.id)));
      const bt = writeBatch(db);
      us.docs.forEach(d => { if (d.id !== SUPER) { bt.delete(d.ref); emails.add(d.id); } });
      bt.delete(doc(db, T.col, b.id));
      await bt.commit();
      md.fechar(); toast(`${T.nome} excluíd${T.o} (${total} registros)`, "ok");
      const lista = [...emails].filter(e => e && e !== SUPER);
      if (lista.length) abrirModal(`<div class="mh"><h2>${T.nome} excluíd${T.o}</h2><button class="icon-btn" data-fechar>✕</button></div>
        <p class="small">Os dados e os acessos foram removidos. Os logins abaixo continuam existindo no Firebase, mas não entram em nada. Se quiser apagá-los também: Console do Firebase → <b>Authentication → Users</b>.</p>
        <div class="link" style="margin-top:10px">${lista.map(esc).join("<br>")}</div>
        <button class="btn block" data-fechar style="margin-top:12px">Entendi</button>`);
    } catch (e) {
      console.error(e); info(""); ok.textContent = "Tentar de novo"; ok.disabled = false; inp.disabled = false;
      toast(erroMsg(e) + " · parte dos dados pode ter sido apagada, tente de novo", "erro");
    }
  };
}

/* ---------- Uso do Firebase (Cloud Monitoring, leitura com o seu login Google) ---------- */
const PROJETOS = { "atendimento-bar": "Bares e salões", "inscricoes-eventos": "Inscrições" };
let PROJETO = firebaseConfig.projectId;
const COTA = { read: 50000, write: 20000, delete: 20000 };
const METRICAS = { read: ["document/read_count", "document/read_ops_count"], write: ["document/write_count", "document/write_ops_count"], delete: ["document/delete_count", "document/delete_ops_count"] };
const U = { token: null, exp: 0, dados: null, carregando: false, erro: "", dias: 30, sel: null };
try { const t = JSON.parse(sessionStorage.getItem("usoToken") || "null"); if (t && t.exp > Date.now() + 60000) { U.token = t.token; U.exp = t.exp; } } catch (e) {}
const CLIENT_ID_PADRAO = "92179047707-qpj2f54isqkhg7jdsu7eh1k6s5f7nh28.apps.googleusercontent.com";
const clientId = () => { try { return localStorage.getItem("usoClientId") || CLIENT_ID_PADRAO; } catch (e) { return CLIENT_ID_PADRAO; } };
/* meia-noite do Pacífico (quando a cota zera) em UTC */
function meiaNoitePacifico(offsetDias = 0) {
  const agora = new Date();
  const partes = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hour12: false, timeZoneName: "shortOffset" }).formatToParts(agora).map(p => [p.type, p.value]));
  const off = parseInt((partes.timeZoneName || "GMT-8").replace("GMT", "")) || -8;
  return new Date(Date.UTC(+partes.year, +partes.month - 1, +partes.day + offsetDias, -off, 0, 0));
}
function carregarGIS() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((ok, erro) => { const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.onload = ok; s.onerror = () => erro(new Error("Sem conexão com o Google")); document.head.appendChild(s); });
}
async function conectarGoogle() {
  const cid = clientId(); if (!cid) return;
  await carregarGIS();
  const tc = google.accounts.oauth2.initTokenClient({
    client_id: cid, scope: "https://www.googleapis.com/auth/monitoring.read", login_hint: SUPER,
    callback: r => {
      if (r.error) { U.erro = "Não foi possível autorizar: " + r.error; renderUso(); return; }
      U.token = r.access_token; U.exp = Date.now() + (r.expires_in || 3600) * 1000;
      try { sessionStorage.setItem("usoToken", JSON.stringify({ token: U.token, exp: U.exp })); } catch (e) {}
      carregarUso();
    }
  });
  tc.requestAccessToken({ prompt: U.token ? "" : "consent" });
}
async function serie(metricas, ini, fim) {
  for (const m of metricas) {
    const p = new URLSearchParams({
      filter: `metric.type="firestore.googleapis.com/${m}"`, "interval.startTime": ini.toISOString(), "interval.endTime": fim.toISOString(),
      "aggregation.alignmentPeriod": "86400s", "aggregation.perSeriesAligner": "ALIGN_SUM", "aggregation.crossSeriesReducer": "REDUCE_SUM"
    });
    const r = await fetch(`https://monitoring.googleapis.com/v3/projects/${PROJETO}/timeSeries?${p}`, { headers: { Authorization: "Bearer " + U.token } });
    if (r.status === 401) { U.token = null; sessionStorage.removeItem("usoToken"); throw new Error("login"); }
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ("Erro " + r.status));
    const pts = (j.timeSeries || []).flatMap(t => t.points || []);
    if (pts.length || m === metricas[metricas.length - 1]) {
      const mapa = {};
      pts.forEach(pt => { const k = pt.interval.endTime.slice(0, 10); mapa[k] = (mapa[k] || 0) + Number(pt.value.int64Value || pt.value.doubleValue || 0); });
      return mapa;
    }
  }
  return {};
}
async function carregarUso() {
  U.carregando = true; U.erro = ""; renderUso();
  try {
    const fim = meiaNoitePacifico(1), ini = new Date(fim.getTime() - U.dias * 864e5);
    const [read, write, del] = await Promise.all([serie(METRICAS.read, ini, fim), serie(METRICAS.write, ini, fim), serie(METRICAS.delete, ini, fim)]);
    const dias = [];
    for (let i = U.dias - 1; i >= 0; i--) {
      const fimDia = new Date(fim.getTime() - i * 864e5), k = fimDia.toISOString().slice(0, 10);
      const rot = new Date(fimDia.getTime() - 864e5 / 2);   // meio do dia de cota, para o rótulo
      dias.push({ k, rotulo: `${pad(rot.getDate())}/${pad(rot.getMonth() + 1)}`, read: read[k] || 0, write: write[k] || 0, delete: del[k] || 0 });
    }
    U.dados = { dias, em: new Date() }; U.sel = null;
  } catch (e) { if (e.message !== "login") U.erro = e.message; }
  U.carregando = false; renderUso();
}
const num = n => Math.round(n).toLocaleString("pt-BR");
function barra(v, cota) {
  const pct = Math.min(100, v / cota * 100), cls = pct >= 90 ? "er" : pct >= 70 ? "warn" : "ok";
  return `<div class="uso-barra"><i class="${cls}" style="width:${Math.max(pct, v ? 1.5 : 0)}%"></i></div>`;
}
function grafico(dias, campo, cota, titulo) {
  const W = 340, H = 150, pl = 34, pr = 6, pt = 10, pb = 22, n = dias.length;
  const max = Math.max(cota * 1.08, ...dias.map(d => d[campo])) || 1;
  const y = v => pt + (H - pt - pb) * (1 - v / max), bw = (W - pl - pr) / n, gap = 2;
  const ticks = [0, cota / 2, cota].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="g${v === cota ? " lim" : ""}"/><text x="${pl - 4}" y="${y(v) + 3}" class="ax" text-anchor="end">${v >= 1000 ? Math.round(v / 1000) + "k" : v}</text>`).join("");
  const barras = dias.map((d, i) => {
    const v = d[campo], x = pl + i * bw + gap / 2, h = Math.max(0, y(0) - y(v)), w = Math.max(1, bw - gap);
    const cls = v >= cota * .9 ? "er" : v >= cota * .7 ? "warn" : "";
    return `<g class="hit" data-dia="${i}"><rect x="${pl + i * bw}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/>${v ? `<path class="bar ${cls} ${U.sel === i ? "sel" : ""}" d="M${x},${y(0)}V${y(v) + Math.min(2, h)}q0,-2 2,-2h${Math.max(0, w - 4)}q2,0 2,2V${y(0)}Z"/>` : ""}</g>`;
  }).join("");
  const rot = dias.map((d, i) => ((i % Math.ceil(n / 6) === 0 && i < n - Math.ceil(n / 12)) || i === n - 1) ? `<text x="${i === n - 1 ? W - pr : pl + i * bw + bw / 2}" y="${H - 6}" class="ax" text-anchor="${i === n - 1 ? "end" : "middle"}">${d.rotulo}</text>` : "").join("");
  return `<div class="uso-graf"><div class="row between"><b>${titulo}</b><span class="small muted">limite grátis ${num(cota)}/dia</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${titulo} por dia">${ticks}${barras}${rot}</svg></div>`;
}
function renderUso() {
  const box = $("#usoBox"); if (!box) return;
  const cid = clientId();
  if (!cid) {
    box.innerHTML = `<div class="card"><b>Conectar ao consumo do Firebase</b>
      <p class="small muted" style="margin:6px 0 10px">Os números vêm direto do Google Cloud (o mesmo que aparece no console). Precisa de uma configuração única: cole abaixo o <b>ID do cliente OAuth</b> criado no Google Cloud. O passo a passo está na conversa.</p>
      <label>ID do cliente OAuth</label><input id="usoCid" placeholder="123…apps.googleusercontent.com" autocapitalize="off">
      <button class="btn block" id="usoSalvarCid" style="margin-top:12px">Salvar</button></div>`;
    $("#usoSalvarCid").onclick = () => { const v = $("#usoCid").value.trim(); if (!/\.apps\.googleusercontent\.com$/.test(v)) return toast("ID inválido: termina com .apps.googleusercontent.com", "erro"); localStorage.setItem("usoClientId", v); renderUso(); };
    return;
  }
  if (!U.token || U.exp < Date.now()) {
    box.innerHTML = `<div class="card center" style="min-height:0;padding:22px"><div style="font-size:34px">📊</div><b>Consumo do Firebase</b>
      <p class="small muted" style="margin:6px 0 12px">Entre com a sua conta Google (${esc(SUPER)}) para ler o uso do projeto ${esc(PROJETO)}.</p>
      ${U.erro ? `<p class="small" style="color:var(--er);margin-bottom:10px">${esc(U.erro)}</p>` : ""}
      <button class="btn" id="usoLogin">Entrar com Google</button>
      <button class="btn ghost sm" id="usoTrocar" style="margin-top:10px">Trocar ID do cliente</button></div>`;
    $("#usoLogin").onclick = () => conectarGoogle().catch(e => toast(e.message, "erro"));
    $("#usoTrocar").onclick = () => { localStorage.removeItem("usoClientId"); renderUso(); };
    return;
  }
  if (U.carregando || !U.dados) {
    box.innerHTML = U.erro ? `<div class="card"><div class="seg" id="usoProj" style="margin:0 0 12px">${Object.entries(PROJETOS).map(([k, t]) => `<button data-p="${k}" class="${PROJETO === k ? "on" : ""}">${t}</button>`).join("")}</div><p style="color:var(--er)">${esc(U.erro)}</p><button class="btn ghost block" id="usoTentar" style="margin-top:10px">Tentar de novo</button></div>` : `<div class="empty">Carregando consumo…</div>`;
    if ($("#usoTentar")) $("#usoTentar").onclick = carregarUso;
    $$("#usoProj button").forEach(b => b.onclick = () => { PROJETO = b.dataset.p; U.dados = null; carregarUso(); });
    if (!U.carregando && !U.dados && !U.erro) carregarUso();
    return;
  }
  const d = U.dados.dias, hoje = d[d.length - 1], s = U.sel != null ? d[U.sel] : null;
  const media = k => d.slice(0, -1).reduce((a, x) => a + x[k], 0) / Math.max(1, d.length - 1);
  const pico = d.reduce((a, x) => x.read > a.read ? x : a, d[0]);
  const item = (k, nome) => `<div class="uso-item"><div class="row between"><span>${nome}</span><b class="num">${num(hoje[k])} <small class="muted">/ ${num(COTA[k])}</small></b></div>${barra(hoje[k], COTA[k])}<div class="small muted">${Math.round(hoje[k] / COTA[k] * 100)}% do limite grátis · média ${num(media(k))}/dia</div></div>`;
  box.innerHTML = `
    <div class="card">
      <div class="seg" id="usoProj" style="margin:0 0 12px">${Object.entries(PROJETOS).map(([k, t]) => `<button data-p="${k}" class="${PROJETO === k ? "on" : ""}">${t}</button>`).join("")}</div>
      <div class="row between"><b>Hoje (cota do dia)</b><button class="btn ghost sm" id="usoAtualizar">↻ Atualizar</button></div>
      <p class="small muted" style="margin:2px 0 10px">A cota zera à meia-noite do Pacífico (~${pad(meiaNoitePacifico(1).getHours())}h no seu horário).</p>
      ${item("read", "Leituras")}${item("write", "Gravações")}${item("delete", "Exclusões")}
    </div>
    <div class="seg" id="usoDias">${[7, 30, 90].map(n => `<button data-d="${n}" class="${U.dias === n ? "on" : ""}">${n} dias</button>`).join("")}</div>
    <div class="card">${grafico(d, "read", COTA.read, "Leituras por dia")}
      <p class="small" id="usoTip" style="min-height:18px;margin-top:4px">${s ? `<b>${s.rotulo}</b>: ${num(s.read)} leituras · ${num(s.write)} gravações · ${num(s.delete)} exclusões` : `<span class="muted">Toque numa barra para ver o dia. Maior dia: ${pico.rotulo} com ${num(pico.read)} leituras.</span>`}</p></div>
    <div class="card">${grafico(d, "write", COTA.write, "Gravações por dia")}</div>
    <details class="card"><summary class="small">Ver tabela</summary><table class="uso-tab"><tr><th>Dia</th><th>Leituras</th><th>Gravações</th><th>Exclusões</th></tr>
      ${d.slice().reverse().map(x => `<tr><td>${x.rotulo}</td><td>${num(x.read)}</td><td>${num(x.write)}</td><td>${num(x.delete)}</td></tr>`).join("")}</table></details>
    <p class="small muted center" style="margin:8px 0 4px">Dados do Google Cloud Monitoring · atualizado às ${U.dados.em.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })} · podem atrasar alguns minutos</p>`;
  $("#usoAtualizar").onclick = carregarUso;
  $$("#usoProj button").forEach(b => b.onclick = () => { if (PROJETO === b.dataset.p) return; PROJETO = b.dataset.p; U.dados = null; carregarUso(); });
  $$("#usoDias button").forEach(b => b.onclick = () => { U.dias = +b.dataset.d; carregarUso(); });
  $$("#usoBox .hit").forEach(g => g.onclick = () => { U.sel = U.sel === +g.dataset.dia ? null : +g.dataset.dia; renderUso(); });
}
