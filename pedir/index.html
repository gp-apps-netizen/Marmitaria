<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9480f">
<title>Pedir marmita</title>
<link rel="manifest" id="mf">
<link rel="icon" id="fav">
<link rel="apple-touch-icon" id="ati">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff8f3;--card:#fff;--tx:#2b2118;--mut:#8a7a6d;--pri:#d9480f;--ok:#2b8a3e;--bd:#f0e2d6;--al:#c92a2a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:96px;font-size:15px}
.hdr{background:var(--pri);color:#fff;padding:18px 16px 14px}
.hdr h1{font-size:22px;line-height:1.2}
.htit{display:flex;align-items:center;gap:12px;min-width:0}
.hlogo{width:58px;height:58px;border-radius:14px;background:#fff;object-fit:contain;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none}
.hdr .info{font-size:13px;opacity:.92;margin-top:4px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hbtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.hbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;background:#fff}
.badge.ok{color:var(--ok)}.badge.off{color:var(--al)}
.aviso{margin:12px 16px 0;background:#fff3bf;border:1px solid #ffe066;border-radius:12px;padding:10px 12px;font-weight:600}
.diasel{display:flex;gap:6px;margin:12px 16px 0}
.diasel button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:12px;padding:10px 6px;font:inherit;font-weight:700;color:var(--tx)}
.diasel button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.diasel small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.encinfo{margin:12px 16px 0;background:#e7f5ff;border:1px solid #a5d8ff;border-radius:12px;padding:10px 12px;color:#1864ab;font-weight:600}
.fechado{margin:12px 16px 0;background:#ffe3e3;border:1px solid #ffc9c9;border-radius:12px;padding:10px 12px;color:var(--al);font-weight:600}
.chips{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--tx);text-decoration:none}
section{scroll-margin-top:60px;padding:0 16px}
.sec{font-size:17px;margin:14px 0 8px}
.prod{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.prod .pi{flex:1;min-width:0}.prod .pi b{display:block}
.prod p{color:var(--mut);font-size:13px;margin:3px 0 6px;line-height:1.35}
.prod img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex-shrink:0}
.pr{font-weight:700;color:var(--pri)}
.prod.esg{opacity:.5;cursor:default}.prod.esg .pr{color:var(--mut)}
.vazio{text-align:center;color:var(--mut);padding:30px 16px}
#bar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));background:var(--pri);color:#fff;border-radius:14px;padding:14px 16px;display:none;justify-content:space-between;align-items:center;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;cursor:pointer}
#bar.on{display:flex}
#barN{background:rgba(255,255,255,.25);border-radius:8px;padding:2px 8px;margin-right:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));position:relative}
.x{position:absolute;right:10px;top:10px;border:0;background:#f1f3f5;border-radius:50%;width:32px;height:32px;font-size:16px}
.sheet h2{font-size:19px;margin:0 36px 6px 0}
.sheet h4{margin:16px 0 8px;font-size:14px}
.mimg{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.mut{color:var(--mut)}.sm{font-size:12.5px}
input,textarea,select{width:100%;font:inherit;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:8px;background:#fff;color:var(--tx)}
textarea{resize:vertical}
.row2{display:flex;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.opt input{width:auto;margin:0;accent-color:var(--pri)}
.opt span{flex:1}
.qtyrow{display:flex;gap:10px;align-items:center;margin-top:14px}
.qty{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px}
.qty button{border:0;background:none;font-size:20px;width:40px;height:44px;color:var(--pri)}
.qty span{min-width:24px;text-align:center;font-weight:700}
.qty.sm button{width:30px;height:30px;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;flex:1}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:10px}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn:disabled{opacity:.6}
.lnk{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;padding:6px 0}
.ci{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.ci .cr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.seg{display:flex;gap:6px;margin:6px 0 4px}
.seg button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:10px;padding:11px;font:inherit;font-weight:600}
.seg button.on{border-color:var(--pri);background:#fff4e6;color:var(--pri)}
.tot{border-top:1px solid var(--bd);margin-top:12px;padding-top:8px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-size:18px;font-weight:800}
.dica{color:var(--ok);font-size:13px;font-weight:600;margin-top:6px}
.alerta{color:var(--al);font-weight:700;margin-top:6px}
#track{padding:16px}
.tcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.tcard h4{margin-bottom:8px}
.thead{display:flex;justify-content:space-between;align-items:flex-start}
.num{font-size:26px;font-weight:800;color:var(--pri)}
.steps{list-style:none;margin:14px 0 4px}
.steps li{position:relative;padding:0 0 16px 30px;color:var(--mut);font-weight:600}
.steps li span{position:absolute;left:4px;top:2px;width:14px;height:14px;border-radius:50%;background:#dee2e6}
.steps li:not(:last-child)::after{content:"";position:absolute;left:10px;top:18px;width:2px;height:calc(100% - 18px);background:#dee2e6}
.steps li.done{color:var(--tx)}.steps li.done span{background:var(--ok)}.steps li.done::after{background:var(--ok)}
.steps li.cur{color:var(--pri)}.steps li.cur span{background:var(--pri);box-shadow:0 0 0 4px #ffd8a8}
.steps small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.okbox{background:#ebfbee;border-color:#b2f2bb;color:var(--ok);font-weight:700;text-align:center}
.li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.qr{display:flex;justify-content:center;margin:12px 0}
.qr img{max-width:220px}
.cc{font-size:12px;height:70px}
.acts{display:flex;flex-direction:column;gap:8px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#212529;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90%;text-align:center}
#toast.on{opacity:1}
.fatal{text-align:center;padding:80px 24px;color:var(--mut)}
</style>
</head>
<body>
<div id="menu">
  <header class="hdr">
    <div class="hrow"><div class="htit"><img id="hLogo" class="hlogo" alt=""><h1 id="hNome">Carregando…</h1></div><span id="hStatus"></span></div>
    <div class="info" id="hInfo"></div>
    <div class="hbtns">
      <button class="hbtn" onclick="meusPedidos()">🧾 Meus pedidos</button>
      <a class="hbtn" id="hWa" style="display:none;text-decoration:none" target="_blank">💬 WhatsApp</a>
      <button class="hbtn" id="btnInstalar" style="display:none" onclick="instalar()">📲 Instalar app</button>
    </div>
  </header>
  <div id="aviso"></div>
  <div id="diaSel"></div>
  <nav class="chips" id="chips"></nav>
  <div id="lista"><p class="vazio">Carregando cardápio…</p></div>
</div>
<div id="track" style="display:none"></div>
<div id="bar" onclick="abrirSacola()"><span><span id="barN">0</span>Ver sacola</span><span id="barT">R$ 0,00</span></div>
<div id="modal" onclick="if(event.target===this)fecharModal()"><div class="sheet"><button class="x" onclick="fecharModal()">✕</button><div id="mbody"></div></div></div>
<div id="toast"></div>

<script>
// ==== Firebase do projeto atendimento-bar (o mesmo do bar e do salão) ====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAeSmdHNn7LTk60DKO3DCGOTvPaNHdzMF4",
  authDomain: "atendimento-bar.firebaseapp.com",
  projectId: "atendimento-bar",
  storageBucket: "atendimento-bar.firebasestorage.app",
  messagingSenderId: "92179047707",
  appId: "1:92179047707:web:08d82fc86c7da2f0215fbe"
};
const REGIAO_FUNCOES = 'southamerica-east1';
// ===================================================================================================

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const round2=v=>Math.round((+v||0)*100)/100;
const hora=ms=>new Date(ms).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const FORMAS={dinheiro:'💵 Dinheiro',cartao:'💳 Cartão (maquininha)',pix:'💠 Pix',pixMP:'⚡ Pix automático'};
const LOJA=(new URLSearchParams(location.search).get('m')||'').trim().toLowerCase();
const LSK=k=>'mm_'+LOJA+'_'+k;
function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(LSK(k)));return v??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(LSK(k),JSON.stringify(v))}catch(e){}}
function num(s){s=String(s??'').replace(/[^\d,.]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)}
function modal(h){$('#mbody').innerHTML=h;$('#modal').classList.add('on');$('.sheet').scrollTop=0}
function fecharModal(){$('#modal').classList.remove('on')}
function waLink(tel,msg){let d=String(tel||'').replace(/\D/g,'');if(d.length<=11)d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg)}
function endTxt(c){c=c||{};return [c.rua&&(c.rua+(c.num?', '+c.num:'')),c.comp,c.bairro,c.ref&&('Ref.: '+c.ref)].filter(Boolean).join(' – ')}
function copiar(id){const el=$('#'+id);const v=el.value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copiado!')).catch(()=>{el.select();document.execCommand('copy');toast('Copiado!')})}
function fatal(m){document.body.innerHTML=`<div class="fatal"><div style="font-size:52px">🍱</div><h2 style="margin-top:10px">${esc(m)}</h2></div>`}

// ---------- Pix copia e cola (BR Code) ----------
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const emv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
const limpa=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim();
function pixPayload(chave,nome,cidade,valor,txid){
  const mai=emv('00','br.gov.bcb.pix')+emv('01',String(chave).trim());
  const tx=String(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***';
  let p=emv('00','01')+emv('26',mai)+emv('52','0000')+emv('53','986')+(valor>0?emv('54',(+valor).toFixed(2)):'')+emv('58','BR')+emv('59',limpa(nome).slice(0,25)||'LOJA')+emv('60',limpa(cidade).slice(0,15)||'BRASIL')+emv('62',emv('05',tx))+'6304';
  return p+crc16(p);
}

// ---------- Firebase ----------
if(!LOJA){fatal('Link incompleto. Peça o link de pedidos para a marmitaria.');throw new Error('sem loja')}
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore();
const lojaRef=db.collection('marmitarias').doc(LOJA);
let loja=null,produtos=[],cart=lsGet('cart',[]),pwaOk=false,pwaLogo=null;
const dStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const HOJE=dStr(new Date()),AMANHA=(()=>{const d=new Date();d.setDate(d.getDate()+1);return dStr(d)})();
let cds={},diaVista=HOJE,escolheuDia=false;
const dowDe=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getDay()};
const dataCurta=s=>{const[y,m,d]=s.split('-').map(Number);return DIAS[new Date(y,m-1,d).getDay()].slice(0,3).toLowerCase()+' '+String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0')};
const ehDoDia=p=>p.doDia===true||(p.doDia===undefined&&(p.dias||[]).length>0&&p.dias.length<7);
function noCardapio(p,data){if(!ehDoDia(p))return true;const c=cds[data];if(c&&c.publicado)return (c.itens||[]).includes(p.id);return (p.dias||[]).includes(dowDe(data))}
function opsDia(p,data){const c=cds[data],at=c&&c.ops&&c.ops[p.id];return (p.grupos||[]).map(g=>({...g,opcoes:(g.opcoes||[]).filter(o=>!at||!at[g.nome]||at[g.nome].includes(o.nome))}))}
const esgot=p=>diaVista===HOJE&&p.esgotado;
const regraTxt=g=>{const mi=+g.min||0,ma=+g.max||0;if(mi&&ma&&mi===ma)return ma===1?'escolha 1':`escolha ${ma}`;if(ma&&!mi)return `até ${ma} · opcional`;if(ma)return `de ${mi} a ${ma}`;return mi?`mín. ${mi}`:'opcional'};
function fmtEscolhas(i){const g={};(i.escolhas||[]).forEach(e=>{(g[e.g]=g[e.g]||[]).push(e.nome)});return Object.entries(g).map(([k,v])=>`${k}: ${v.join(', ')}`).join(' · ')}
function encerradoHoje(){if(!loja||!loja.aberto)return true;if(loja.horaLimite){const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(hm>=loja.horaLimite)return true}return false}
const podeAmanha=()=>!!(loja&&loja.aceitaEncomenda&&cds[AMANHA]&&cds[AMANHA].publicado);
function verDia(d){escolheuDia=true;diaVista=d;render();window.scrollTo({top:0,behavior:'smooth'})}

lojaRef.onSnapshot(s=>{
  if(!s.exists||s.data().status!=='ativo'){fatal('Marmitaria não encontrada ou indisponível no momento.');return}
  loja={id:s.id,...s.data()};renderHeader();render();
  if(location.hash.startsWith('#p=')&&lastPed)renderTrack(lastPed);
},e=>{console.error(e);fatal('Não foi possível carregar. Verifique sua conexão.')});
lojaRef.collection('produtos').where('ativo','==',true).onSnapshot(q=>{produtos=q.docs.map(d=>({id:d.id,...d.data()}));render()});
[HOJE,AMANHA].forEach(d=>lojaRef.collection('cardapios').doc(d).onSnapshot(s=>{cds[d]=s.exists?s.data():null;if(!escolheuDia&&loja&&encerradoHoje()&&podeAmanha())diaVista=AMANHA;render()},()=>{}));
setInterval(()=>{if(loja&&diaVista===HOJE)render()},60000);

function renderHeader(){
  document.title=loja.nome+' – Pedidos';
  if(loja.cor){document.documentElement.style.setProperty('--pri',loja.cor);document.querySelector('meta[name=theme-color]').content=loja.cor}
  $('#hNome').textContent=loja.nome;
  const lg=$('#hLogo');if(loja.logo){lg.src=loja.logo;lg.style.display='block'}else{lg.removeAttribute('src');lg.style.display='none'}
  if(pwaLogo!==(loja.logo||'')){pwaLogo=loja.logo||'';setupPWA()}
  $('#hStatus').innerHTML=loja.aberto?'<span class="badge ok">● Aberto</span>':'<span class="badge off">● Fechado</span>';
  const ent=loja.fazEntrega!==false;
  $('#hInfo').textContent=[loja.horario,ent&&loja.tempoEntrega?'Entrega em '+loja.tempoEntrega:'',ent?(+loja.taxaEntrega>0?'Entrega '+brl(loja.taxaEntrega):'Entrega grátis'):'Somente retirada',+loja.pedidoMinimo>0?'Mínimo '+brl(loja.pedidoMinimo):'',loja.horaLimite?'Pedidos até '+loja.horaLimite:''].filter(Boolean).join(' · ');
  if(loja.whatsapp){const a=$('#hWa');a.style.display='';a.href=waLink(loja.whatsapp,'Olá! Vim pelo cardápio online.')}
}

// ---------- Cardápio ----------
function precoBase(p){const v=p.variacoes||[];return v.length?Math.min(...v.map(x=>+x.preco||0)):(+p.preco||0)}
function render(){
  if(!loja)return;
  if(diaVista===AMANHA&&!podeAmanha())diaVista=HOJE;
  const D=diaVista,dow=dowDe(D),enc=D!==HOJE;
  // avisos e seletor de dia
  let h='';
  if(!enc&&encerradoHoje()){
    h+=`<div class="fechado">🔒 ${loja.aberto?'Pedidos para hoje encerrados'+(loja.horaLimite?' às '+esc(loja.horaLimite):''):'Estamos fechados no momento.'}${loja.horario?' Horário: '+esc(loja.horario):''}</div>`;
    if(podeAmanha())h+=`<div class="encinfo" style="cursor:pointer" onclick="verDia('${AMANHA}')">📅 Já dá para encomendar para amanhã (${dataCurta(AMANHA)}) → ver cardápio</div>`;
  }
  if(enc)h+=`<div class="encinfo">📅 Cardápio de amanhã (${dataCurta(AMANHA)}). Seu pedido fica como <b>encomenda</b> para amanhã.</div>`;
  const aviso=enc?(cds[AMANHA]||{}).aviso:loja.avisoDia;
  if(aviso)h+=`<div class="aviso">📣 ${esc(aviso)}</div>`;
  $('#aviso').innerHTML=h;
  $('#diaSel').innerHTML=podeAmanha()?`<div class="diasel"><button class="${!enc?'on':''}" onclick="verDia('${HOJE}')">Hoje<small>${dataCurta(HOJE)}${encerradoHoje()?' · encerrado':''}</small></button><button class="${enc?'on':''}" onclick="verDia('${AMANHA}')">📅 Amanhã<small>${dataCurta(AMANHA)} · encomenda</small></button></div>`:'';
  // produtos do dia escolhido
  const ps=produtos.filter(p=>noCardapio(p,D)).sort((a,b)=>(a.ordem||0)-(b.ordem||0)||String(a.nome).localeCompare(b.nome));
  const doDia=ps.filter(ehDoDia),resto=ps.filter(p=>!ehDoDia(p));
  const ord=loja.categorias||['Marmitas','Pratos','Porções','Bebidas','Sobremesas','Adicionais'];
  const cats=[...new Set(resto.map(p=>p.categoria||'Outros'))].sort((a,b)=>{const ia=ord.indexOf(a),ib=ord.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)});
  const secs=[];
  if(doDia.length)secs.push({t:'🍽️ Cardápio de '+(enc?'amanhã':'hoje')+' · '+DIAS[dow],c:enc?'Amanhã':'Hoje',ps:doDia});
  cats.forEach(c=>secs.push({t:c,c,ps:resto.filter(p=>(p.categoria||'Outros')===c)}));
  $('#chips').innerHTML=secs.map((s,i)=>`<a class="chip" href="javascript:void 0" onclick="document.getElementById('s${i}').scrollIntoView({behavior:'smooth'})">${esc(s.c)}</a>`).join('');

  ${ads.length?`<h4>Adicionais</h4>${ads.map((a,i)=>`<label class="opt"><input type="checkbox" onchange="pmAd(${i},this.checked)"><span>${esc(a.nome)}</span><b>+ ${brl(a.preco)}</b></label>`).join('')}`:''}

}
function unitDe(p,vNome,ads,escolhas){
  let u=+p.preco||0;
  if((p.variacoes||[]).length){const v=p.variacoes.find(x=>x.nome===vNome);if(!v)return null;u=+v.preco||0}
  for(const a of ads||[]){const x=(p.adicionais||[]).find(y=>y.nome===a.nome);if(!x)return null;u+=+x.preco||0}
  for(const e of escolhas||[]){const g=(p.grupos||[]).find(y=>y.nome===e.g),o=g&&(g.opcoes||[]).find(y=>y.nome===e.nome);if(!o)return null;u+=+o.extra||0}
  return round2(u);
}

function itemOk(it,D){

}

}
function pmSel(){const p=pm.p;return{v:(p.variacoes||[]).length?p.variacoes[pm.vi].nome:'',ads:pm.ads.map(i=>({nome:p.adicionais[i].nome,preco:+p.adicionais[i].preco||0})),esc:pm.grupos.flatMap((g,gi)=>(pm.esc[gi]||[]).map(n=>({g:g.nome,nome:n,extra:+(g.opcoes.find(o=>o.nome===n)||{}).extra||0})))}}
function pmTot(){const s=pmSel();$('#pmAdd').textContent='Adicionar · '+brl(unitDe(pm.p,s.v,s.ads,s.esc)*pm.q)}
function pmAd(i,on){pm.ads=pm.ads.filter(x=>x!==i);if(on)pm.ads.push(i);pmTot()}

  const cli={nome:g('cNome'),tel:g('cTel').replace(/\D/g,''),rua:g('cRua'),num:g('cNum'),bairro:g('cBairro'),comp:g('cComp'),ref:g('cRef')};

    itens:cart.map(i=>({pid:i.pid,nome:i.nome,variacao:i.variacao||'',adicionais:i.adicionais||[],escolhas:i.escolhas||[],qtd:i.qtd,unit:i.unit,obs:i.obs||'',total:round2(i.unit*i.qtd)})),paraData:D,encomenda:enc,
    subtotal:sub,taxa:tx,total,pagamento:{forma:ck.forma,trocoPara:troco},obs:g('cObs'),
    criadoEm:firebase.firestore.FieldValue.serverTimestamp(),criadoMs:agora,statusMs:{novo:agora}};
  enviando=true;const b=$('#btnEnviar');b.disabled=true;b.textContent='Enviando…';
  try{
    const cr=lojaRef.collection('meta').doc('contador'),pr=lojaRef.collection('pedidos').doc();
    await db.runTransaction(async t=>{const c=await t.get(cr);const n=(c.exists?(c.data().n||0):0)+1;t.set(cr,{n});t.set(pr,{...ped,numero:n})});
    const meus=lsGet('pedidos',[]);meus.unshift(pr.id);lsSet('pedidos',meus.slice(0,30));
    cart=[];salvarCart();fecharModal();location.hash='p='+pr.id;
  }catch(e){console.error(e);toast(e.code==='permission-denied'?(enc?'A loja não está recebendo encomendas agora.':'A loja não está recebendo pedidos agora.'):'Não foi possível enviar. Verifique a conexão e tente de novo.')}
  enviando=false;if(b){b.disabled=false;b.textContent='Fazer pedido'}
}

const ETAPAS={entrega:[['novo','Pedido recebido'],['preparo','Em preparo'],['saiu','Saiu para entrega'],['entregue','Entregue']],retirada:[['novo','Pedido recebido'],['preparo','Em preparo'],['saiu','Pronto para retirada'],['entregue','Retirado']]};
let unsubPed=null,lastPed=null,mpChamado={},mpErro={},pendingQR=null;
function route(){

function stTxt(p){if(p.status==='cancelado')return 'Cancelado';const e=(ETAPAS[p.tipo]||ETAPAS.entrega).find(x=>x[0]===p.status);return e?e[1]:p.status}

  <div class="tot"><div><span>Subtotal</span><span>${brl(p.subtotal)}</span></div>${p.tipo==='entrega'?`<div><span>Entrega</span><span>${p.taxa?brl(p.taxa):'Grátis'}</span></div>`:''}<div class="big"><span>Total</span><span>${brl(p.total)}</span></div></div>

function blocoPagamento(p){

    return `<div class="tcard"><h4>💠 Pague com Pix</h4><p class="mut sm">Valor: <b>${brl(p.total)}</b>. Escaneie o QR Code ou copie o código.</p><div id="qrPix" class="qr"></div><textarea readonly class="cc" id="ccPix">${esc(code)}</textarea><button class="btn pri" style="width:100%" onclick="copiar('ccPix')">Copiar código Pix</button><p class="mut sm" style="margin-top:8px">Chave: ${esc(loja.pixChave)}${loja.pixNome?' · '+esc(loja.pixNome):''}</p>${loja.whatsapp?`<a class="btn" style="width:100%;margin-top:8px" target="_blank" href="${waLink(loja.whatsapp,`Olá! Segue o comprovante do Pix do pedido #${p.numero} (${brl(p.total)}).`)}">📎 Enviar comprovante no WhatsApp</a>`:''}</div>`;
  }
  const mp=p.mp||{};
  if(mp.copiaECola&&!(mp.expiraMs&&mp.expiraMs<Date.now())){
    return `<div class="tcard"><h4>⚡ Pague com Pix</h4><p class="mut sm">Valor: <b>${brl(mp.valor||p.total)}</b>. A confirmação é automática.</p>${mp.qrBase64?`<div class="qr"><img src="data:image/png;base64,${mp.qrBase64}" alt="QR Pix"></div>`:''}<textarea readonly class="cc" id="ccMP">${esc(mp.copiaECola)}</textarea><button class="btn pri" style="width:100%" onclick="copiar('ccMP')">Copiar código Pix</button><p class="mut sm" style="margin-top:8px;text-align:center">⏳ Aguardando pagamento…</p></div>`;
  }
  if(mpErro[p.id])return `<div class="tcard"><h4>⚡ Pix</h4><p class="alerta">${esc(mpErro[p.id])}</p><button class="btn" style="width:100%;margin-top:8px" onclick="gerarPixMP('${p.id}',true)">Tentar de novo</button></div>`;
  if(mp.expiraMs&&mp.expiraMs<Date.now())return `<div class="tcard"><h4>⚡ Pix</h4><p class="mut">O código Pix expirou.</p><button class="btn pri" style="width:100%" onclick="gerarPixMP('${p.id}',true)">Gerar novo Pix</button></div>`;
  if(!mpChamado[p.id])setTimeout(()=>gerarPixMP(p.id),0);
  return '<div class="tcard"><h4>⚡ Pix</h4><p class="mut">Gerando o QR Code do Pix…</p></div>';
}
async function gerarPixMP(id,forcar){
  if(mpChamado[id]&&!forcar)return;mpChamado[id]=true;delete mpErro[id];
  try{await firebase.app().functions(REGIAO_FUNCOES).httpsCallable('mpPixMarmita')({lojaId:LOJA,pedidoId:id})}
  catch(e){console.error(e);mpErro[id]='Não foi possível gerar o Pix automático. Fale com a loja pelo WhatsApp.';if(lastPed&&lastPed.id===id)renderTrack(lastPed)}
}
async function cancelarCliente(){
  if(!lastPed||!confirm('Cancelar este pedido?'))return;
  try{await lojaRef.collection('pedidos').doc(lastPed.id).update({status:'cancelado',statusMs:{...(lastPed.statusMs||{}),cancelado:Date.now()},canceladoPor:'cliente'});toast('Pedido cancelado')}
  catch(e){toast('A loja já aceitou o pedido. Fale com ela pelo WhatsApp.')}
}
function pedirDeNovo(){
  if(!lastPed)return;let falt=0;
  lastPed.itens.forEach(it=>{const u=itemOk(it,diaVista);if(u===null){falt++;return}cart.push({pid:it.pid,nome:it.nome,variacao:it.variacao,adicionais:it.adicionais||[],escolhas:it.escolhas||[],qtd:it.qtd,unit:u,obs:it.obs||''})});
  salvarCart();location.hash='';
  if(falt)toast(falt+' item(ns) não estão no cardápio '+(diaVista===HOJE?'de hoje':'de amanhã'));
  setTimeout(abrirSacola,150);
}
async function meusPedidos(){
  const ids=lsGet('pedidos',[]);
  if(!ids.length)return modal('<h2>Meus pedidos</h2><p class="vazio">Você ainda não fez pedidos aqui.</p>');
  modal('<h2>Meus pedidos</h2><div id="mpList"><p class="vazio">Carregando…</p></div>');
  const docs=await Promise.all(ids.slice(0,15).map(id=>lojaRef.collection('pedidos').doc(id).get().catch(()=>null)));
  $('#mpList').innerHTML=docs.filter(d=>d&&d.exists).map(d=>{const p=d.data();return `<div class="ci" style="cursor:pointer" onclick="fecharModal();location.hash='p=${d.id}'"><div><b>#${p.numero}</b> · ${new Date(p.criadoMs).toLocaleDateString('pt-BR')}<div class="mut sm">${p.itens.length} item(ns) · ${stTxt(p)}</div></div><b>${brl(p.total)}</b></div>`}).join('')||'<p class="vazio">Nenhum pedido encontrado.</p>';
}

// ---------- PWA ----------
let promptInst=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInst=e;$('#btnInstalar').style.display=''});
function instalar(){if(promptInst){promptInst.prompt();promptInst=null;$('#btnInstalar').style.display='none'}}
async function setupPWA(){
  try{
    const cor=loja.cor||'#d9480f';
    let img=null;if(loja.logo){img=new Image();img.src=loja.logo;try{await img.decode()}catch(e){img=null}}
    const ic=s=>{const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
      if(img){x.fillStyle='#fff';x.fillRect(0,0,s,s);const m=s*.12,k=Math.min((s-2*m)/img.naturalWidth,(s-2*m)/img.naturalHeight),w=img.naturalWidth*k,h=img.naturalHeight*k;x.drawImage(img,(s-w)/2,(s-h)/2,w,h)}
      else{x.fillStyle=cor;x.fillRect(0,0,s,s);x.font=`${Math.round(s*.55)}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('🍱',s/2,s*.54)}
      return c.toDataURL('image/png')};
    const i192=ic(192),i512=ic(512),base=location.origin+location.pathname;
    const m={name:loja.nome,short_name:String(loja.nome).slice(0,14),start_url:base+'?m='+LOJA,scope:base,display:'standalone',background_color:'#fff8f3',theme_color:cor,
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    $('#mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    $('#fav').href=i192;$('#ati').href=i192;
  }catch(e){}
}
route();
</script>
