window.temaAtual=function(){try{return localStorage.getItem('gpx_tema')||'auto'}catch(e){return 'auto'}};
window.definirTema=function(t){try{localStorage.setItem('gpx_tema',t)}catch(e){}ap();if(window.aoMudarTema)window.aoMudarTema()};

<style>
:root{--bg:#f3f6f9;--card:#fff;--tx:#1f2328;--mut:#6b7480;--pri:#1c7ed6;--ok:#2b8a3e;--bd:#dfe5eb;--al:#c92a2a;--warn:#e8590c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{background:var(--card);border-radius:18px;padding:26px 20px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
.lbox h1{font-size:21px;margin:8px 0 16px}
.top{position:sticky;top:0;z-index:10;background:var(--pri);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-size:17px}.top .sm{opacity:.85}
main{padding:12px 12px 40px;max-width:640px;margin:0 auto}
input{width:100%;font:inherit;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:12px;padding:12px 10px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.big{width:100%;padding:15px;font-size:16px}
.btn.lt{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);padding:7px 11px;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:12px;padding:11px 6px;font:inherit;font-weight:700}
.tabs button.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.ent{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--warn);border-radius:14px;padding:14px;margin-bottom:12px}
.ent.saiu{border-left-color:var(--pri)}
.eh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font-size:22px;font-weight:800}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;background:#f1f3f5}
.t-saiu{background:#d0ebff;color:#1864ab}.t-prep{background:#fff3bf;color:#a85d00}.t-pago{background:#d3f9d8;color:var(--ok)}.t-cobrar{background:#ffe3e3;color:var(--al)}
.end{font-size:17px;font-weight:700;margin:8px 0 2px;line-height:1.3}
.cob{background:#fff4e6;border:1px solid #ffd8a8;border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:700}
.cob.pg{background:#ebfbee;border-color:#b2f2bb;color:var(--ok)}
.its{font-size:13.5px;color:var(--mut);margin:6px 0}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.g4 .btn{padding:10px 4px;font-size:13px;flex-direction:column;gap:2px}
.g4 .btn i{font-style:normal;font-size:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vazio{text-align:center;color:var(--mut);padding:40px 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat .v{font-size:21px;font-weight:800;margin-top:2px}
.lin{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;margin-bottom:6px}
.opts{display:grid;gap:8px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#212529;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:92%;text-align:center}
#toast.on{opacity:1}

<body>
<div id="login" class="center" style="display:none"><div class="lbox">
  <div style="font-size:46px">🛵</div><h1>Entregas</h1>
  <div id="lMsg" class="mut sm" style="margin-bottom:10px"></div>
  <input id="lEmail" type="email" placeholder="E-mail" autocomplete="username">
  <input id="lSenha" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
  <button class="btn pri big" onclick="entrar()">Entrar</button>
  <div id="lSair" style="display:none;margin-top:10px"><button class="btn" onclick="auth.signOut()">Sair desta conta</button></div>
</div></div>
<div id="carregando" class="center"><div class="mut">Carregando…</div></div>
<div id="app" style="display:none">
  <header class="top"><div><b id="tNome">Entregas</b><div class="sm" id="tSub"></div></div><div style="display:flex;gap:6px"><button class="btn lt" id="btnTema" onclick="trocarTema()">🌙</button><button class="btn lt" onclick="sair()">Sair</button></div></header>
  <main>
    <div class="tabs"><button id="tbA" onclick="aba='abertas';render()">🛵 Para entregar</button><button id="tbH" onclick="aba='hoje';render()">📋 Meu dia</button></div>
    <div id="conteudo"></div>
  </main>
</div>
<div id="modal" onclick="if(event.target===this)fechar()"><div class="sheet" id="mbody"></div></div>
<div id="toast"></div>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAeSmdHNn7LTk60DKO3DCGOTvPaNHdzMF4",
  authDomain: "atendimento-bar.firebaseapp.com",
  projectId: "atendimento-bar",
  storageBucket: "atendimento-bar.firebasestorage.app",
  messagingSenderId: "92179047707",
  appId: "1:92179047707:web:08d82fc86c7da2f0215fbe"
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const round2=v=>Math.round((+v||0)*100)/100;
const hora=ms=>ms?new Date(ms).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const hojeStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const FORMAS={dinheiro:'💵 Dinheiro',cartao:'💳 Cartão',pix:'💠 Pix',pixMP:'⚡ Pix'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000)}
function modal(h){$('#mbody').innerHTML=h;$('#modal').classList.add('on')}
function fechar(){$('#modal').classList.remove('on')}
function endTxt(c){c=c||{};return [c.rua&&(c.rua+(c.num?', '+c.num:'')),c.bairro].filter(Boolean).join(' – ')}
function telLimpo(t){let d=String(t||'').replace(/\D/g,'');if(d.length<=11)d='55'+d;return d}
/* mesmo cálculo do painel */
function calcAcerto(peds,cfg){
  cfg=cfg||{};const ent=peds.filter(p=>p.status==='entregue'),n=ent.length,v=+cfg.valor||0;
  const taxas=ent.reduce((t,p)=>t+(+p.taxa||0),0);
  const din=ent.filter(p=>p.recebido&&p.recebido.forma==='dinheiro').reduce((t,p)=>t+(+p.recebido.valor||0),0);
  const pagar=cfg.modo==='taxa'?taxas*v/100:cfg.modo==='diaria'?(n>0?v:0):n*v;
  return{n,taxas:round2(taxas),din:round2(din),pagar:round2(pagar),saldo:round2(din-pagar)};
}
const cfgTxt=c=>!c||!(+c.valor)?'não configurado':c.modo==='taxa'?`${String(c.valor).replace('.',',')}% da taxa de entrega`:c.modo==='diaria'?`diária de ${brl(c.valor)}`:`${brl(c.valor)} por entrega`;

firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore();
let email='',perfil=null,lojaId=null,loja=null,abertas=[],doDia=[],aba='abertas',unsubs=[];

function telaLogin(msg,sair){$('#carregando').style.display='none';$('#app').style.display='none';$('#login').style.display='';$('#lMsg').innerHTML=msg||'';$('#lSair').style.display=sair?'':'none'}
async function entrar(){const e=$('#lEmail').value.trim(),s=$('#lSenha').value;if(!e||!s)return toast('Informe e-mail e senha');try{await auth.signInWithEmailAndPassword(e,s)}catch(err){toast(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(err.code)?'E-mail ou senha incorretos':'Erro: '+err.message)}}
function sair(){if(confirm('Sair do app de entregas?'))auth.signOut()}

auth.onAuthStateChanged(async u=>{
  unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];abertas=[];doDia=[];
  if(!u)return telaLogin('');
  email=(u.email||'').toLowerCase();
  let s=null;try{s=await db.collection('usuariosMarmita').doc(email).get()}catch(e){}
  if(!s||!s.exists)return telaLogin('Este login não está cadastrado como entregador.',true);
  perfil=s.data();
  if(perfil.papel!=='entregador')return telaLogin('Este login é da equipe da loja.<br><a href="../loja/">Abrir o painel da marmitaria</a>',true);
  lojaId=perfil.marmitaId;
  $('#login').style.display='none';$('#carregando').style.display='none';$('#app').style.display='';
  const ref=db.collection('marmitarias').doc(lojaId),col=ref.collection('pedidos');
  unsubs.push(ref.onSnapshot(d=>{loja=d.data()||{};$('#tNome').textContent=loja.nome||'Entregas';if(loja.cor){document.documentElement.style.setProperty('--pri',loja.cor);document.querySelector('meta[name=theme-color]').content=loja.cor}render()}));
  let first=true;
  unsubs.push(col.where('entregador.email','==',email).where('entregaAberta','==',true).onSnapshot(q=>{
    if(!first&&q.docChanges().some(c=>c.type==='added')){if(navigator.vibrate)navigator.vibrate([300,120,300]);beep();toast('🛵 Nova entrega para você')}
    first=false;abertas=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.despachoOrdem||0)-(b.despachoOrdem||0)||(a.criadoMs||0)-(b.criadoMs||0));render();
  },e=>{console.error(e);toast('Erro ao carregar entregas')}));
  unsubs.push(col.where('entregador.email','==',email).where('entregaDia','==',hojeStr()).onSnapshot(q=>{doDia=q.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(e)));
});
let actx=null;function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=988;g.gain.value=.3;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.35)}catch(e){}}

function render(){
  if(!lojaId)return;
  $('#tSub').textContent=(perfil.nome||email)+' · '+abertas.length+' para entregar';
  $('#tbA').classList.toggle('on',aba==='abertas');$('#tbH').classList.toggle('on',aba==='hoje');
  $('#tbA').textContent=`🛵 Para entregar${abertas.length?' ('+abertas.length+')':''}`;
  const el=$('#conteudo');
  if(aba==='abertas'){el.innerHTML=abertas.length?abertas.map(cardEntrega).join(''):'<p class="vazio">Nenhuma entrega com você agora. 👍<br><br>Quando a loja passar um pedido para você, ele aparece aqui com aviso sonoro.</p>';return}
  const pend=doDia.filter(p=>!p.acertoId),a=calcAcerto(pend,loja&&loja.pagEntregador),fechados=doDia.filter(p=>p.acertoId&&p.status==='entregue').length;
  el.innerHTML=`<div class="stats">
    <div class="stat"><div class="mut sm">Entregas hoje</div><div class="v">${a.n}</div></div>
    <div class="stat"><div class="mut sm">Você recebe</div><div class="v" style="color:var(--ok)">${brl(a.pagar)}</div><div class="mut sm">${esc(cfgTxt(loja&&loja.pagEntregador))}</div></div>
    <div class="stat"><div class="mut sm">Dinheiro em mãos</div><div class="v">${brl(a.din)}</div></div>
    <div class="stat"><div class="mut sm">${a.saldo>=0?'Devolver à loja':'A loja te paga'}</div><div class="v" style="color:${a.saldo>=0?'var(--warn)':'var(--ok)'}">${brl(Math.abs(a.saldo))}</div></div></div>
  ${fechados?`<p class="mut sm" style="margin-bottom:8px">✅ ${fechados} entrega(s) de hoje já acertada(s) com a loja.</p>`:''}
  ${doDia.filter(p=>p.status==='entregue').sort((x,y)=>(y.entregueMs||0)-(x.entregueMs||0)).map(p=>`<div class="lin"><div><b>#${p.numero}</b> ${esc((p.cliente||{}).nome)}<div class="mut sm">${hora(p.entregueMs)} · ${p.recebido?FORMAS[p.recebido.forma]+' '+brl(p.recebido.valor):'já estava pago'}${p.acertoId?' · ✅ acertado':''}</div></div><b>${brl(p.total)}</b></div>`).join('')||'<p class="vazio">Nenhuma entrega concluída hoje.</p>'}`;
}
function cardEntrega(p){
  const c=p.cliente||{},pg=p.pagamento||{},saiu=p.status==='saiu';
  const end=endTxt(c),q=encodeURIComponent(end+(loja&&loja.cidade?', '+loja.cidade:''));
  const troco=pg.trocoPara?round2(pg.trocoPara-p.total):0;
  return `<div class="ent ${saiu?'saiu':''}">
  <div class="eh"><span class="num">#${p.numero}</span><span class="tag ${saiu?'t-saiu':'t-prep'}">${saiu?'🛵 Em rota':'🍳 Aguardando sair'}</span></div>
  <div class="end">📍 ${esc(end)}</div>
  ${c.comp?`<div class="sm">${esc(c.comp)}</div>`:''}${c.ref?`<div class="sm mut">Ref.: ${esc(c.ref)}</div>`:''}
  <div class="sm" style="margin-top:4px">👤 <b>${esc(c.nome)}</b></div>
  <div class="its">${(p.itens||[]).map(i=>`${i.qtd}× ${esc(i.nome)}${i.variacao?' ('+esc(i.variacao)+')':''}`).join(' · ')}</div>
  ${p.obs?`<div class="sm" style="color:#a85d00">📝 ${esc(p.obs)}</div>`:''}
  ${p.pago?`<div class="cob pg">✅ Já está pago · ${brl(p.total)}</div>`:`<div class="cob">💰 Cobrar ${brl(p.total)} · ${FORMAS[pg.forma]||'—'}${troco>0?`<br>Levar <u>${brl(troco)}</u> de troco (para ${brl(pg.trocoPara)})`:''}</div>`}
  <div class="g4"><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${q}"><i>🗺️</i>Maps</a><a class="btn" target="_blank" href="https://waze.com/ul?q=${q}&navigate=yes"><i>🚗</i>Waze</a><a class="btn" href="tel:${esc(c.tel)}"><i>📞</i>Ligar</a><a class="btn" target="_blank" href="https://wa.me/${telLimpo(c.tel)}?text=${encodeURIComponent(`Olá, ${(c.nome||'').split(' ')[0]}! Sou o entregador da ${loja?loja.nome:''}, estou a caminho com seu pedido #${p.numero} 🛵`)}"><i>💬</i>Zap</a></div>
  <div class="g2">${saiu?'':`<button class="btn pri" onclick="sai('${p.id}')">🛵 Saí</button>`}<button class="btn ok" style="${saiu?'grid-column:1/3':''}" onclick="entregar('${p.id}')">✅ Entregue</button></div></div>`;
}
const pRef=id=>db.collection('marmitarias').doc(lojaId).collection('pedidos').doc(id);
async function sai(id){const t=Date.now();try{await pRef(id).update({status:'saiu','statusMs.saiu':t,saidaMs:t});toast('Boa entrega! 🛵')}catch(e){toast('Erro: '+e.message)}}
function entregar(id){
  const p=abertas.find(x=>x.id===id);if(!p)return;
  if(p.pago)return modal(`<h2>Confirmar entrega #${p.numero}?</h2><p class="mut">${esc((p.cliente||{}).nome)} · já estava pago</p><div class="opts"><button class="btn ok big" onclick="concluir('${id}',null)">✅ Entregue</button><button class="btn big" onclick="fechar()">Voltar</button></div>`);
  modal(`<h2>Entrega #${p.numero} · ${brl(p.total)}</h2><p class="mut">Como o cliente pagou?</p><div class="opts">
  <button class="btn big" onclick="concluir('${id}','dinheiro')">💵 Dinheiro</button>
  <button class="btn big" onclick="concluir('${id}','cartao')">💳 Cartão (maquininha)</button>
  <button class="btn big" onclick="concluir('${id}','pix')">💠 Pix</button>
  <button class="btn big" style="color:var(--al)" onclick="concluir('${id}','naopagou')">❌ Não pagou (avisar a loja)</button></div>`);
}
async function concluir(id,forma){
  const p=abertas.find(x=>x.id===id),t=Date.now(),upd={status:'entregue','statusMs.entregue':t,entregueMs:t,entregaAberta:false};
  if(forma&&forma!=='naopagou'){upd.pago=true;upd.recebido={forma,valor:p.total,ms:t}}
  try{await pRef(id).update(upd);fechar();toast(forma==='naopagou'?'Entregue. A loja vai ver que ficou sem pagamento.':'Entrega concluída ✅')}catch(e){toast('Erro: '+e.message)}
}
const TEMAS=[['auto','📱 Tema automático'],['escuro','🌙 Tema escuro'],['claro','☀️ Tema claro']];
function iconeTema(){const b=$('#btnTema');if(b)b.textContent={auto:'📱',escuro:'🌙',claro:'☀️'}[temaAtual()]}
function trocarTema(){const i=TEMAS.findIndex(t=>t[0]===temaAtual()),n=TEMAS[(i+1)%3];definirTema(n[0]);toast(n[1])}
window.aoMudarTema=iconeTema;iconeTema();
(function(){try{const ic=s=>{const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.fillStyle='#1c7ed6';x.fillRect(0,0,s,s);x.font=`${Math.round(s*.55)}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('🛵',s/2,s*.54);return c.toDataURL('image/png')};
const i1=ic(192),i2=ic(512),base=location.origin+location.pathname;
$('#mf').href=URL.createObjectURL(new Blob([JSON.stringify({name:'Entregas',short_name:'Entregas',start_url:base,scope:base,display:'standalone',background_color:'#f3f6f9',theme_color:'#1c7ed6',icons:[{src:i1,sizes:'192x192',type:'image/png'},{src:i2,sizes:'512x512',type:'image/png'}]})],{type:'application/manifest+json'}));
$('#fav').href=i1;$('#ati').href=i1}catch(e){}})();
</script>
</body>
