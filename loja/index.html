<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9480f">
<title>Painel da Marmitaria</title>
<link rel="manifest" id="mf">
<link rel="icon" id="fav">
<link rel="apple-touch-icon" id="ati">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f6f4f2;--card:#fff;--tx:#25201b;--mut:#857a70;--pri:#d9480f;--ok:#2b8a3e;--bd:#e9e2db;--al:#c92a2a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{background:var(--card);border-radius:18px;padding:26px 20px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
.lbox h1{font-size:21px;margin:8px 0 16px}
.top{position:sticky;top:0;z-index:10;background:var(--pri);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tn{font-weight:800;font-size:17px;line-height:1.2}.top .mut{color:rgba(255,255,255,.85)}
.tr{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
.tab{display:none}.tab.on{display:block}
.bn{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.bn button{flex:1;border:0;background:none;padding:9px 2px 8px;font:inherit;font-size:11.5px;color:var(--mut);font-weight:600;position:relative}
.bn button i{display:block;font-style:normal;font-size:20px}
.bn button.on{color:var(--pri)}
.bn .bdg{position:absolute;top:4px;left:55%;background:var(--al);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;display:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h4{margin-bottom:8px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14.5px}
label.ck input{width:auto;margin:0;accent-color:var(--pri)}
input,textarea,select{width:100%;font:inherit;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px;background:#fff;color:var(--tx)}
input[type=color]{height:44px;padding:4px}
.sub{border-left:3px solid var(--bd);padding-left:10px;margin:4px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row2{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.big{width:100%;padding:14px;font-size:16px;margin-bottom:12px}
.btn.danger{color:var(--al);border-color:#ffc9c9}
.btn:disabled{opacity:.6}
.ib{border:0;background:rgba(0,0,0,.06);border-radius:8px;width:36px;height:36px;font-size:16px;flex-shrink:0}
.top .ib{background:rgba(255,255,255,.2);color:#fff}
.lnk{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;padding:4px 0}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.vazio{text-align:center;color:var(--mut);padding:28px 10px}
.sec{font-size:15px;margin:16px 2px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:18px;padding:6px 11px;font:inherit;font-size:13px;font-weight:600}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.chip b{background:var(--pri);color:#fff;border-radius:9px;padding:0 6px;font-size:11px}
.bar1{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.bar1 input{width:auto;margin:0}
.pc{background:var(--card);border:1px solid var(--bd);border-left:5px solid #ced4da;border-radius:12px;padding:12px;margin-bottom:10px}
.pc.st-novo{border-left-color:var(--al);animation:pulse 1.6s infinite}
.pc.st-preparo{border-left-color:#f08c00}.pc.st-saiu{border-left-color:#1c7ed6}.pc.st-entregue{border-left-color:var(--ok)}.pc.st-cancelado{opacity:.6}
@keyframes pulse{50%{box-shadow:0 0 0 3px #ffc9c9}}
.pch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pn{font-size:20px;font-weight:800}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:#f1f3f5;vertical-align:middle}
.t-novo{background:#ffe3e3;color:var(--al)}.t-preparo{background:#fff3bf;color:#a85d00}.t-saiu{background:#d0ebff;color:#1864ab}.t-entregue,.pago{background:#d3f9d8;color:var(--ok)}.t-cancelado{background:#e9ecef;color:#495057}
.pcl{margin:6px 0 2px}.pcl a{color:inherit}
.its{list-style:none;margin:8px 0;padding:8px 10px;background:#faf8f6;border-radius:8px}
.its li{padding:3px 0}
.obs{color:#a85d00;font-weight:600;font-size:13px;margin:4px 0}
.pct{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-top:4px}
.pct b{font-size:17px}
.pca{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pr-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.pr-row.inat{opacity:.55}
.sw{position:relative;display:inline-block;width:46px;height:26px;margin:0;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;margin:0}
.sw span{position:absolute;inset:0;background:#adb5bd;border-radius:26px;transition:.2s}
.sw span::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::before{transform:translateX(20px)}
.dias{display:flex;flex-wrap:wrap;gap:6px}
.dias label{display:flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:8px;padding:6px 9px;margin:0;font-weight:500}
.dias input{width:auto;margin:0;accent-color:var(--pri)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat .v{font-size:20px;font-weight:800;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left}
td.r,th.r{text-align:right}
.qr{display:flex;justify-content:center;margin:12px 0}
.tlogo{width:38px;height:38px;border-radius:10px;object-fit:contain;background:#fff;flex-shrink:0;display:none}
.fotobox{display:flex;gap:10px;align-items:center;margin:4px 0 8px}
.fotoprev{width:84px;height:84px;border-radius:12px;object-fit:cover;background:#f1f3f5;border:1px dashed var(--bd);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mut);flex-shrink:0;overflow:hidden}
.fotoprev img{width:100%;height:100%;object-fit:cover}
.logoprev{width:96px;height:96px;border-radius:16px;background:#fff;border:1px dashed var(--bd);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0}
.logoprev img{width:100%;height:100%;object-fit:contain}
.seg2 label.ck{border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin:0 0 6px}
.pthumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));position:relative}
.sheet h2{font-size:19px;margin:0 36px 6px 0}
.x{position:absolute;right:10px;top:10px;border:0;background:#f1f3f5;border-radius:50%;width:32px;height:32px;font-size:16px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#212529;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:92%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="login" class="center" style="display:none">
  <div class="lbox">
    <div style="font-size:46px">🍱</div>
    <h1>Painel da Marmitaria</h1>
    <div id="lMsg" class="mut sm" style="margin-bottom:10px"></div>
    <input id="lEmail" type="email" placeholder="E-mail" autocomplete="username">
    <input id="lSenha" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn pri big" onclick="entrar()">Entrar</button>
    <button class="lnk" onclick="esqueci()">Esqueci minha senha</button>
    <div id="lSair" style="display:none;margin-top:8px"><button class="btn" onclick="auth.signOut()">Sair desta conta</button></div>
  </div>
</div>
<div id="carregando" class="center"><div class="mut">Carregando…</div></div>

<div id="app" style="display:none">
  <header class="top">
    <div style="min-width:0;display:flex;align-items:center;gap:10px"><img id="tLogo" class="tlogo" alt=""><div style="min-width:0"><div class="tn" id="tNome">Marmitaria</div><div class="mut sm" id="tSub"></div></div></div>
    <div class="tr">
      <button class="ib" id="btnSom" onclick="toggleSom()" title="Som de novos pedidos">🔕</button>
      <label class="sw" title="Aberto para pedidos"><input type="checkbox" id="swAberto" onchange="setAberto(this.checked)"><span></span></label>
      <span id="lblAberto">Fechado</span>
    </div>
  </header>
  <main>
    <section id="t-pedidos" class="tab"></section>
    <section id="t-cardapio" class="tab"></section>
    <section id="t-relatorio" class="tab"></section>
    <section id="t-estoque" class="tab"></section>
    <section id="t-ajustes" class="tab"></section>
    <section id="t-admin" class="tab"></section>
  </main>
  <nav class="bn">
    <button data-t="pedidos" onclick="irTab('pedidos')"><i>🧾</i>Pedidos<span class="bdg" id="bdgNovos"></span></button>
    <button data-t="cardapio" onclick="irTab('cardapio')"><i>🍱</i>Cardápio</button>
    <button data-t="relatorio" onclick="irTab('relatorio')"><i>📊</i>Relatório</button>
    <button data-t="estoque" onclick="irTab('estoque')"><i>📦</i>Estoque<span class="bdg" id="bdgEst"></span></button>
    <button data-t="ajustes" onclick="irTab('ajustes')"><i>⚙️</i>Ajustes</button>
    <button data-t="admin" id="navAdmin" style="display:none" onclick="irTab('admin')"><i>🛡️</i>Suporte</button>
  </nav>
</div>
<div id="modal" onclick="if(event.target===this)fecharModal()"><div class="sheet"><button class="x" onclick="fecharModal()">✕</button><div id="mbody"></div></div></div>
<div id="toast"></div>

<script>
// ==== Firebase do projeto atendimento-bar (o mesmo do bar e do salão) ====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAeSmdHNn7LTk60DKO3DCGOTvPaNHdzMF4",
  authDomain: "atendimento-bar.firebaseapp.com",
  projectId: "atendimento-bar",
  storageBucket: "atendimento-bar.firebasestorage.app",
  messagingSenderId: "92179047707",
  appId: "1:92179047707:web:08d82fc86c7da2f0215fbe"
};
const SUPER_ADMIN = 'godoygpx@gmail.com';
// ===================================================================================================

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const round2=v=>Math.round((+v||0)*100)/100;
const hora=ms=>ms?new Date(ms).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
function num(s){s=String(s??'').replace(/[^\d,.]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0}
const fmtNum=v=>(+v||0)?String(+v).replace('.',','):'';
const DIASC=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const FORMAS={dinheiro:'💵 Dinheiro',cartao:'💳 Cartão',pix:'💠 Pix (chave)',pixMP:'⚡ Pix automático'};
const ST={novo:'Novo',preparo:'Em preparo',saiu:'Saiu p/ entrega',entregue:'Entregue',cancelado:'Cancelado'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000)}
function modal(h){$('#mbody').innerHTML=h;$('#modal').classList.add('on');$('.sheet').scrollTop=0}
function fecharModal(){$('#modal').classList.remove('on')}
function waLink(tel,msg){let d=String(tel||'').replace(/\D/g,'');if(d.length<=11)d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg)}
function fmtTel(t){const d=String(t||'').replace(/\D/g,'');return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length===10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d}
function endTxt(c){c=c||{};return [c.rua&&(c.rua+(c.num?', '+c.num:'')),c.comp,c.bairro,c.ref&&('Ref.: '+c.ref)].filter(Boolean).join(' – ')}
function dStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const hojeStr=()=>dStr(new Date());
function dt(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+/,'').slice(0,40);
function copiarTxt(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado!')).catch(()=>prompt('Copie:',t))}
function baseApp(){return location.origin+location.pathname.replace(/loja\/?(index\.html)?$/,'')}
const linkCli=id=>baseApp()+'pedir/?m='+id;

firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore();
let estoque={},insumos=[],movs=[],encomendas=[],pedA=[],pedB=[],pedC=[],unsubPedB=null,unsubPedC=null;
let user=null,perfil=null,isSuper=false,lojaId=null,loja=null,produtos=[],pedidos=[],unsub=[],unsubPed=null,tabAtual='pedidos',diaPedidos=hojeStr(),filtro='ativos',primeira=true;
const isDono=()=>isSuper||(perfil&&perfil.marmitaId===lojaId&&(perfil.papel||'dono')==='dono');
const USERS='usuariosMarmita';
const diasAte=s=>Math.round((new Date(s+'T12:00')-new Date(hojeStr()+'T12:00'))/864e5);
const lojaRef=()=>db.collection('marmitarias').doc(lojaId);

// ---------- Login ----------
function telaLogin(msg,sair){$('#carregando').style.display='none';$('#app').style.display='none';$('#login').style.display='';$('#lMsg').textContent=msg||'';$('#lSair').style.display=sair?'':'none'}
async function entrar(){const e=$('#lEmail').value.trim(),s=$('#lSenha').value;if(!e||!s)return toast('Informe e-mail e senha');try{await auth.signInWithEmailAndPassword(e,s)}catch(err){toast(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(err.code)?'E-mail ou senha incorretos':'Erro: '+err.message)}}
async function esqueci(){const e=$('#lEmail').value.trim();if(!e)return toast('Digite seu e-mail primeiro');try{await auth.sendPasswordResetEmail(e);toast('Enviamos um link para '+e)}catch(err){toast('Erro: '+err.message)}}
function limpar(){unsub.forEach(f=>{try{f()}catch(e){}});unsub=[];[unsubPed,unsubPedB,unsubPedC].forEach(f=>{if(f)f()});unsubPed=unsubPedB=unsubPedC=null;pedidos=[];encomendas=[];cardapios={};if(unsubEnt){unsubEnt();unsubEnt=null}entregadores=[];cdEd=null;cdData=null;produtos=[];loja=null;estoque={};insumos=[];movs=[]}

auth.onAuthStateChanged(async u=>{
  limpar();user=u;perfil=null;lojaId=null;
  if(!u)return telaLogin('');
  const email=(u.email||'').toLowerCase();isSuper=email===SUPER_ADMIN;
  try{const s=await db.collection(USERS).doc(email).get();if(s.exists)perfil=s.data()}catch(e){console.error(e)}
  if(!perfil&&!isSuper)return telaLogin('Este login ('+u.email+') não está vinculado a nenhuma marmitaria.',true);
  if(perfil&&perfil.papel==='entregador'&&!isSuper){location.href=baseApp()+'entrega/';return}
  $('#login').style.display='none';$('#carregando').style.display='none';$('#app').style.display='';
  $('#navAdmin').style.display=isSuper?'':'none';
  const pm=(new URLSearchParams(location.search).get('m')||'').trim();
  let lid=perfil?perfil.marmitaId:null;
  if(isSuper)lid=pm||localStorage.getItem('mm_super_loja')||lid;
  if(lid){if(isSuper)localStorage.setItem('mm_super_loja',lid);abrirLoja(lid)}else{renderTopo();irTab('admin')}
});

function abrirLoja(id){
  limpar();lojaId=id;primeira=true;
  unsub.push(lojaRef().onSnapshot(s=>{
    if(!s.exists){toast('Marmitaria não encontrada');if(isSuper){localStorage.removeItem('mm_super_loja');lojaId=null;irTab('admin')}return}
    loja={id:s.id,...s.data()};renderTopo();if(tabAtual==='pedidos')renderPedidos();
  },e=>toast('Sem permissão para esta marmitaria')));
  unsub.push(lojaRef().collection('produtos').onSnapshot(q=>{produtos=q.docs.map(d=>({id:d.id,...d.data()}));if(tabAtual==='cardapio')renderCardapio();if(tabAtual==='estoque')renderEstoque();checarProducao()}));
  unsub.push(lojaRef().collection('estoque').onSnapshot(q=>{estoque={};q.docs.forEach(d=>estoque[d.id]=d.data());badgeEstoque();if(tabAtual==='estoque')renderEstoque()},e=>console.error(e)));
  unsub.push(lojaRef().collection('insumos').onSnapshot(q=>{insumos=q.docs.map(d=>({id:d.id,...d.data()}));badgeEstoque();if(tabAtual==='estoque')renderEstoque()},e=>console.error(e)));
  unsub.push(lojaRef().collection('cardapios').where('data','>=',somaDias(hojeStr(),-8)).onSnapshot(q=>{
    cardapios={};q.docs.forEach(d=>cardapios[d.id]=d.data());
    if(tabAtual==='cardapio'&&cdAba==='dia'&&!(cdEd&&cdEd.mexido)){cdEd=null;renderDia()}
    checarProducao();
  },e=>console.error(e)));
  ouvirEntregadores();
  diaPedidos=hojeStr();ouvirPedidos();irTab('pedidos');
}
function renderTopo(){
  $('#tNome').textContent=loja?loja.nome:'Administração';
  const lg=$('#tLogo');if(loja&&loja.logo){lg.src=loja.logo;lg.style.display='block'}else{lg.removeAttribute('src');lg.style.display='none'}
  $('#tSub').textContent=(isSuper?'Administrador (suporte)':isDono()?'Responsável':'Funcionário')+(loja&&loja.status!=='ativo'?' · SUSPENSA':'');
  $('#swAberto').checked=!!(loja&&loja.aberto);$('#swAberto').disabled=!loja;
  $('#lblAberto').textContent=loja&&loja.aberto?'Aberto':'Fechado';
  renderSomBtn();
}
function irTab(t){
  if(!lojaId&&t!=='admin'){toast('Escolha uma marmitaria na aba Suporte');t='admin'}
  tabAtual=t;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==='t-'+t));
  document.querySelectorAll('.bn button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ({pedidos:renderPedidos,cardapio:renderCardapio,relatorio:renderRelatorio,estoque:renderEstoque,ajustes:renderAjustes,admin:renderAdmin})[t]();
  window.scrollTo(0,0);
}
async function setAberto(v){try{await lojaRef().update({aberto:v});toast(v?'Loja ABERTA para pedidos':'Loja FECHADA para pedidos')}catch(e){toast('Erro: '+e.message);renderTopo()}}

// ---------- Som / alertas ----------
let somOn=localStorage.getItem('mm_som')==='1',actx=null,wake=null;
function ctx(){actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}

function ouvirPedidos(){
  [unsubPed,unsubPedB,unsubPedC].forEach(f=>{if(f)f()});unsubPed=unsubPedB=unsubPedC=null;pedA=pedB=pedC=[];
  const ini=dt(diaPedidos),fim=dt(diaPedidos);fim.setDate(fim.getDate()+1);const col=lojaRef().collection('pedidos'),dia=diaPedidos;
  const ouvir=(q,set,alerta)=>{let first=true;return q.onSnapshot(sn=>{
    const novos=[];if(!first)sn.docChanges().forEach(c=>{const d=c.doc.data();if(c.type==='added'&&d.status==='novo'&&alerta(d))novos.push(d)});first=false;
    set(sn.docs.map(d=>({id:d.id,...d.data()})));juntarPedidos();if(novos.length)alertaNovo(novos[0]);
  },e=>{console.error(e);toast('Erro ao carregar pedidos: '+e.message)})};
  unsubPed=ouvir(col.where('criadoEm','>=',ini).where('criadoEm','<',fim).orderBy('criadoEm','desc'),x=>pedA=x,d=>!d.paraData);
  unsubPedB=ouvir(col.where('paraData','==',dia),x=>pedB=x,()=>true);
  if(dia===hojeStr())unsubPedC=ouvir(col.where('paraData','>',dia),x=>pedC=x,()=>true);
}

const precoTxt=p=>(p.variacoes||[]).length?p.variacoes.map(v=>`${v.nome} ${brl(v.preco)}`).join(' · '):brl(p.preco);
const ehDoDia=p=>p.doDia===true||(p.doDia===undefined&&(p.dias||[]).length>0&&p.dias.length<7);
const somaDias=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return dStr(d)};

const dataLonga=s=>{const d=dt(s);return DIASL[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')};
function fmtEscolhas(i){const g={};(i.escolhas||[]).forEach(e=>{(g[e.g]=g[e.g]||[]).push(e.nome)});return Object.entries(g).map(([k,v])=>`${k}: ${v.join(', ')}`).join(' · ')}

/* ===== Cardápio do dia ===== */
function cdNovo(data,base){
  // base: documento a copiar; sem base, preenche pelos dias habituais
  const dow=dt(data).getDay();
  if(base)return{itens:[...(base.itens||[])].filter(id=>produtos.some(p=>p.id===id)),qtd:{...(base.qtd||{})},ops:JSON.parse(JSON.stringify(base.ops||{})),aviso:base.aviso||''};
  return{itens:produtos.filter(p=>ehDoDia(p)&&(p.dias||[]).includes(dow)).map(p=>p.id),qtd:{},ops:{},aviso:''};
}
function cdCarregar(){const d=cardapios[cdData];cdEd=d?cdNovo(cdData,d):cdNovo(cdData);cdEd.publicado=!!(d&&d.publicado);cdEd.mexido=false}
function renderDia(){
  const box=$('#cdBox');if(!box)return;
  const h=hojeStr();if(!cdData||cdData<h)cdData=h;
  if(!cdEd||cdEd.data!==cdData||!cdEd.mexido){cdCarregar();cdEd.data=cdData}

let aplicando=false,chkProd=null;

async function aplicarProducao(data,forcar){
  const c=cardapios[data];if(aplicando||!c||!c.publicado||(c.estoqueAplicado&&!forcar))return;
  const q=c.qtd||{},pids=Object.keys(q);if(!pids.length){if(!c.estoqueAplicado)await lojaRef().collection('cardapios').doc(data).update({estoqueAplicado:true}).catch(()=>{});return}

    const b=db.batch(),itensMov=[];
    pids.forEach(pid=>{const p=produtos.find(x=>x.id===pid);if(!p)return;
      b.set(lojaRef().collection('estoque').doc(pid),{controla:true,qtd:q[pid]},{merge:true});

      if(p.esgotado&&q[pid]>0)b.update(lojaRef().collection('produtos').doc(pid),{esgotado:false,esgotadoAuto:false});

    });
    b.set(lojaRef().collection('movEstoque').doc(),{tipo:'ajuste',ref:'Produção do dia '+data.split('-').reverse().slice(0,2).join('/'),itens:itensMov,ms:Date.now(),por:user.email});
    const enc=(await lojaRef().collection('pedidos').where('paraData','==',data).get()).docs.map(d=>({id:d.id,...d.data()}));
    enc.filter(p=>p.encomenda&&p.status!=='cancelado'&&!p.estoqueBaixado).forEach(p=>{if(movimentarEstoque(b,p,-1))b.update(lojaRef().collection('pedidos').doc(p.id),{estoqueBaixado:true})});
    b.update(lojaRef().collection('cardapios').doc(data),{estoqueAplicado:true});
    await b.commit();c.estoqueAplicado=true;

  aplicando=false;
}

/* ===== Divulgar (imagem + texto) ===== */
function itensDoDia(data){
  const c=cardapios[data],dow=dt(data).getDay();
  const doDia=produtos.filter(p=>p.ativo!==false&&ehDoDia(p)&&(c&&c.publicado?(c.itens||[]).includes(p.id):(p.dias||[]).includes(dow)));
  const mont=produtos.filter(p=>p.ativo!==false&&!ehDoDia(p)&&p.montavel);
  const opsDe=p=>(p.grupos||[]).map(g=>{const at=c&&c.ops&&c.ops[p.id]&&c.ops[p.id][g.nome];return{nome:g.nome,ops:(g.opcoes||[]).filter(o=>!at||at.includes(o.nome)).map(o=>o.nome)}}).filter(g=>g.ops.length);
  return [...doDia,...mont].map(p=>({p,grupos:p.montavel?opsDe(p):[]}));
}
function textoDivulgar(data){
  const L=itensDoDia(data),c=cardapios[data]||{},aviso=data===hojeStr()?(loja.avisoDia||c.aviso):c.aviso;
  let t=`🍱 *${loja.nome}*\n📅 *Cardápio de ${rotDia(data)==='Hoje'?'hoje':rotDia(data)==='Amanhã'?'amanhã':dataLonga(data)}*${rotDia(data)==='Hoje'||rotDia(data)==='Amanhã'?' ('+dataLonga(data)+')':''}\n`;
  if(aviso)t+=`\n${aviso}\n`;
  L.forEach(({p,grupos})=>{t+=`\n• *${p.nome}* – ${precoTxt(p)}`;if(p.descricao&&!grupos.length)t+=`\n   ${p.descricao}`;grupos.forEach(g=>t+=`\n   ${g.nome}: ${g.ops.join(', ')}`)});
  if(!L.length)t+='\n(cardápio ainda não montado)';
  if(loja.horaLimite)t+=`\n\n⏰ Pedidos até ${loja.horaLimite}`;
  if(loja.fazEntrega!==false)t+=`\n🛵 Entrega ${+loja.taxaEntrega>0?brl(loja.taxaEntrega):'grátis'}`;
  return t+`\n\n👉 Peça pelo link: ${linkCli(lojaId)}`;
}
async function imagemDivulgar(data){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),cor=loja.cor||'#d9480f';
  x.fillStyle='#fff8f3';x.fillRect(0,0,W,H);x.fillStyle=cor;x.fillRect(0,0,W,300);
  let lx=70;
  if(loja.logo){try{const im=new Image();im.src=loja.logo;await im.decode();x.save();x.beginPath();x.arc(170,150,100,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.clip();const k=Math.min(170/im.naturalWidth,170/im.naturalHeight);x.drawImage(im,170-im.naturalWidth*k/2,150-im.naturalHeight*k/2,im.naturalWidth*k,im.naturalHeight*k);x.restore();lx=300}catch(e){}}
  x.fillStyle='#fff';x.font='bold 64px system-ui,sans-serif';x.textBaseline='middle';fitText(x,loja.nome,lx,120,W-lx-60);
  x.font='40px system-ui,sans-serif';x.fillText('Cardápio · '+dataLonga(data),lx,200);
  const L=itensDoDia(data),c2=cardapios[data]||{},aviso=data===hojeStr()?(loja.avisoDia||c2.aviso):c2.aviso;
  let y=360;
  if(aviso){x.fillStyle='#fff3bf';rr(x,60,y-10,W-120,90,24);x.fill();x.fillStyle='#5c3d00';x.font='bold 40px system-ui,sans-serif';fitText(x,'📣 '+aviso,90,y+35,W-180);y+=120}
  const linhas=[];L.forEach(({p,grupos})=>{linhas.push({t:p.nome,pr:precoTxt(p),b:true});grupos.forEach(g=>linhas.push({t:g.nome+': '+g.ops.join(', ')}));if(!grupos.length&&p.descricao)linhas.push({t:p.descricao})});
  if(!linhas.length)linhas.push({t:'Cardápio ainda não montado',b:true});

  linhas.forEach(l=>{if(l.b){y+=14;x.font=`bold ${fs}px system-ui,sans-serif`;const w=x.measureText(l.pr||'').width,nw=x.measureText('• '+l.t).width;if(l.pr&&w+nw+40<=W-140){x.fillStyle=cor;x.fillText(l.pr,W-70-w,y+fs*.6);x.fillStyle='#2b2118';x.fillText('• '+l.t,70,y+fs*.6);y+=fs*1.5}else{x.fillStyle='#2b2118';fitText(x,'• '+l.t,70,y+fs*.6,W-140);y+=fs*1.3;if(l.pr){x.fillStyle=cor;x.font=`bold ${Math.round(fs*.8)}px system-ui,sans-serif`;fitText(x,l.pr,110,y+fs*.5,W-180);y+=fs*1.15}}}else{x.fillStyle='#6b5d50';x.font=`${Math.round(fs*.78)}px system-ui,sans-serif`;y=quebra(x,l.t,110,y+fs*.55,W-180,fs*1.05);y+=fs*.35}});
  x.fillStyle=cor;x.fillRect(0,H-200,W,200);x.fillStyle='#fff';x.font='bold 48px system-ui,sans-serif';x.fillText('📲 Peça pelo link',70,H-140);
  x.font='34px system-ui,sans-serif';fitText(x,linkCli(lojaId).replace(/^https?:\/\//,''),70,H-80,W-140);
  if(loja.horaLimite){x.font='bold 34px system-ui,sans-serif';const t='⏰ até '+loja.horaLimite;x.fillText(t,W-70-x.measureText(t).width,H-140)}

}
function fitText(x,t,X,Y,maxW){let s=String(t);if(x.measureText(s).width<=maxW)return x.fillText(s,X,Y);while(s.length>1&&x.measureText(s+'…').width>maxW)s=s.slice(0,-1);x.fillText(s+'…',X,Y)}

function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}

// ---------- Entregadores: despacho e acerto ----------
// pedido.entregador {email,nome} · entregaAberta (true enquanto não entregue) · entregaDia · despachoOrdem · recebido {forma,valor} · acertoId
// acertos/{id}: {entregador, nome, dia, n, taxas, din, pagar, saldo, cfg, pedidos[], ms, por}
let entregadores=[],unsubEnt=null;
function calcAcerto(peds,cfg){
  cfg=cfg||{};const ent=peds.filter(p=>p.status==='entregue'),n=ent.length,v=+cfg.valor||0;
  const taxas=ent.reduce((t,p)=>t+(+p.taxa||0),0);
  const din=ent.filter(p=>p.recebido&&p.recebido.forma==='dinheiro').reduce((t,p)=>t+(+p.recebido.valor||0),0);
  const pagar=cfg.modo==='taxa'?taxas*v/100:cfg.modo==='diaria'?(n>0?v:0):n*v;
  return{n,taxas:round2(taxas),din:round2(din),pagar:round2(pagar),saldo:round2(din-pagar)};
}
const cfgTxt=c=>!c||!(+c.valor)?'pagamento não configurado (Ajustes)':c.modo==='taxa'?`${String(c.valor).replace('.',',')}% da taxa de entrega`:c.modo==='diaria'?`diária de ${brl(c.valor)}`:`${brl(c.valor)} por entrega`;

async function atribuir(id,tirar){
  const p=achar(id),ref=lojaRef().collection('pedidos').doc(id);
  if(tirar){try{await ref.update({entregador:firebase.firestore.FieldValue.delete(),entregaAberta:false,entregaDia:firebase.firestore.FieldValue.delete()});fecharModal();toast('Entregador removido')}catch(e){toast('Erro: '+e.message)}return}
  const em=(document.querySelector('input[name=entg]:checked')||{}).value;if(!em)return toast('Escolha o entregador');
  const e=entregadores.find(x=>x.email===em),sai=$('#entSai').checked,t=Date.now();
  const upd={entregador:{email:e.email,nome:e.nome},entregaAberta:true,entregaDia:p.paraData||dStr(new Date(p.criadoMs||t)),despachoOrdem:t};
  if(sai){upd.status='saiu';upd['statusMs.saiu']=t;upd.saidaMs=t}
  try{
    const b=db.batch();
    if(sai&&!p.estoqueBaixado&&!(p.paraData&&p.paraData>hojeStr())&&movimentarEstoque(b,p,-1))upd.estoqueBaixado=true;
    b.update(ref,upd);await b.commit();fecharModal();toast(`Passado para ${e.nome.split(' ')[0]} 🛵`);
  }catch(err){toast('Erro: '+err.message)}
}

async function fecharAcerto(em,dia){

function lerImagem(file){return new Promise((ok,erro)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{ok(im)};im.onerror=()=>erro(new Error('Não foi possível abrir esta imagem'));im.src=u})}
async function reduzirImagem(file,max,modo){
  const im=await lerImagem(file);let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  if(modo==='logo'){let png=(x.drawImage(im,0,0,w,h),c.toDataURL('image/png'));if(png.length<160000)return png;x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);return c.toDataURL('image/jpeg',.88)}
  x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  let q=.78,d=c.toDataURL('image/jpeg',q);while(d.length>140000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}
  return d;
}

// ---------- Estoque e custos ----------
// estoque/{produtoId}: {controla, qtd, minimo, custo, custoVar{tamanho:custo}, custoAd{adicional:custo}, ficha[{id,qtd}]}
// insumos/{id}: {nome, unidade, qtd, minimo, custo}   movEstoque/{id}: histórico
const INC=v=>firebase.firestore.FieldValue.increment(v);
const fmtQ=v=>(Math.round((+v||0)*1000)/1000).toLocaleString('pt-BR');
const precoBase=p=>(p.variacoes||[]).length?Math.min(...p.variacoes.map(v=>+v.preco||0)):(+p.preco||0);
const r4=v=>Math.round((+v||0)*10000)/10000;
let estAba='produtos',ee=null;
function custoFicha(e){return (e&&e.ficha||[]).reduce((t,l)=>{const s=insumos.find(x=>x.id===l.id);return t+(s?(+s.custo||0)*(+l.qtd||0):0)},0)}
function custoBase(pid){const e=estoque[pid]||{};return +e.custo>0?+e.custo:custoFicha(e)}
function custoItem(i){
  const e=estoque[i.pid]||{};
  let c=(i.variacao&&e.custoVar&&+e.custoVar[i.variacao]>0)?+e.custoVar[i.variacao]:custoBase(i.pid);
  (i.adicionais||[]).forEach(a=>{c+=+((e.custoAd||{})[a.nome])||0});
  return c;
}
function emAlerta(){
  return [...produtos.filter(p=>{const e=estoque[p.id];return e&&e.controla&&(+e.qtd||0)<=(+e.minimo||0)}).map(p=>p.nome),
    ...insumos.filter(s=>+s.minimo>0&&(+s.qtd||0)<=+s.minimo).map(s=>s.nome)];
}

  if(!lojaId)return '';const a=emAlerta();if(!a.length)return '';
  return `<div class="card" style="background:#fff4e6;border-color:#ffd8a8;cursor:pointer" onclick="irTab('estoque')"><b>📦 Estoque baixo:</b> <span class="sm">${a.slice(0,4).map(esc).join(', ')}${a.length>4?' e mais '+(a.length-4):''}</span></div>`;
}
/* Baixa (sinal -1) ou estorna (sinal +1) o estoque de um pedido dentro do batch. Retorna true se mexeu em algo. */
function movimentarEstoque(b,p,sinal){
  const tot={},ins={},avisosE=[];let mexeu=false;
  (p.itens||[]).forEach(i=>{
    const e=estoque[i.pid],q=+i.qtd||0;if(!e)return;
    if(e.controla)tot[i.pid]=(tot[i.pid]||0)+q;
    (e.ficha||[]).forEach(l=>{if(insumos.find(s=>s.id===l.id))ins[l.id]=(ins[l.id]||0)+q*(+l.qtd||0)});
  });
  for(const pid in tot){
    const d=sinal*tot[pid],novo=(+estoque[pid].qtd||0)+d,pr=produtos.find(x=>x.id===pid);mexeu=true;
    b.set(lojaRef().collection('estoque').doc(pid),{qtd:INC(d)},{merge:true});
    if(pr){
      if(novo<=0&&sinal<0&&!pr.esgotado)b.update(lojaRef().collection('produtos').doc(pid),{esgotado:true,esgotadoAuto:true});
      else if(novo>0&&sinal>0&&pr.esgotadoAuto)b.update(lojaRef().collection('produtos').doc(pid),{esgotado:false,esgotadoAuto:false});
      if(sinal<0&&novo<=(+estoque[pid].minimo||0))avisosE.push(`${pr.nome}: ${fmtQ(novo)}`);
    }
  }
  for(const id in ins){
    const d=r4(sinal*ins[id]),s=insumos.find(x=>x.id===id),novo=(+s.qtd||0)+d;mexeu=true;
    b.update(lojaRef().collection('insumos').doc(id),{qtd:INC(d)});
    if(sinal<0&&+s.minimo>0&&novo<=+s.minimo)avisosE.push(`${s.nome}: ${fmtQ(novo)} ${s.unidade||''}`);
  }
  if(mexeu){
    b.set(lojaRef().collection('movEstoque').doc(),{tipo:sinal<0?'venda':'estorno',ref:'Pedido #'+p.numero,ms:Date.now(),por:user.email,
      itens:[...Object.keys(tot).map(pid=>({nome:(produtos.find(x=>x.id===pid)||{}).nome||pid,qtd:sinal*tot[pid]})),
        ...Object.keys(ins).map(id=>{const s=insumos.find(x=>x.id===id)||{};return{nome:s.nome||id,qtd:r4(sinal*ins[id]),un:s.unidade||''}})]});
    if(avisosE.length)setTimeout(()=>toast('⚠️ Estoque baixo – '+avisosE.join(' · ')),500);
  }
  return mexeu;
}

let relDe=null,relAte=null,relCache=[];
function renderRelatorio(){
  const h=hojeStr();
  $('#t-relatorio').innerHTML=`<div class="card"><h4>📊 Relatório de vendas</h4><div class="row2"><div style="flex:1"><label>De</label><input type="date" id="rDe" value="${relDe||h}"></div><div style="flex:1"><label>Até</label><input type="date" id="rAte" value="${relAte||h}"></div></div>
  <div class="chips"><button class="chip" onclick="relPer(0)">Hoje</button><button class="chip" onclick="relPer(1)">Ontem</button><button class="chip" onclick="relPer(7)">7 dias</button><button class="chip" onclick="relPer('mes')">Este mês</button><button class="chip" onclick="relPer('ant')">Mês passado</button></div>
  <button class="btn pri" style="width:100%" onclick="gerarRel()">Gerar relatório</button></div><div id="relOut"></div>`;
  if(relDe)gerarRel();
}
function relPer(k){const t=new Date();let a=new Date(t),b=new Date(t);if(k===1){a.setDate(t.getDate()-1);b=new Date(a)}else if(k===7)a.setDate(t.getDate()-6);else if(k==='mes')a=new Date(t.getFullYear(),t.getMonth(),1);else if(k==='ant'){a=new Date(t.getFullYear(),t.getMonth()-1,1);b=new Date(t.getFullYear(),t.getMonth(),0)}$('#rDe').value=dStr(a);$('#rAte').value=dStr(b);gerarRel()}
async function gerarRel(){
  relDe=$('#rDe').value;relAte=$('#rAte').value;if(relDe>relAte)return toast('Período inválido');
  const ini=dt(relDe),fim=dt(relAte);fim.setDate(fim.getDate()+1);
  $('#relOut').innerHTML='<p class="vazio">Calculando…</p>';
  let ps;try{ps=(await lojaRef().collection('pedidos').where('criadoEm','>=',ini).where('criadoEm','<',fim).orderBy('criadoEm').get()).docs.map(d=>d.data())}catch(e){return $('#relOut').innerHTML='<p class="vazio">Erro: '+esc(e.message)+'</p>'}
  relCache=ps;const ok=ps.filter(p=>p.status!=='cancelado'),canc=ps.length-ok.length;
  const s=(a,k)=>a.reduce((t,p)=>t+(+p[k]||0),0),fat=s(ok,'total'),tx=s(ok,'taxa'),sub=s(ok,'subtotal');
  const ent=ok.filter(p=>p.tipo==='entrega').length,aReceber=ok.filter(p=>!p.pago).reduce((t,p)=>t+(+p.total||0),0);
  const pf={},it={},pd={};
  ok.forEach(p=>{const f=(p.pagamento||{}).forma||'?';pf[f]=pf[f]||{n:0,v:0};pf[f].n++;pf[f].v+=+p.total||0;
    const d=new Date(p.criadoMs).toLocaleDateString('pt-BR');pd[d]=pd[d]||{n:0,v:0};pd[d].n++;pd[d].v+=+p.total||0;
    (p.itens||[]).forEach(i=>{const k=i.nome+(i.variacao?' ('+i.variacao+')':'');it[k]=it[k]||{q:0,v:0,c:0};it[k].q+=+i.qtd||0;it[k].v+=+i.total||0;it[k].c+=custoItem(i)*(+i.qtd||0)})});
  const cmv=Object.values(it).reduce((t,x)=>t+x.c,0),lucro=sub-cmv,temCusto=cmv>0;
  const top=Object.entries(it).sort((a,b)=>b[1].q-a[1].q);
  $('#relOut').innerHTML=`<div class="stats">
   <div class="stat"><div class="mut sm">Faturamento</div><div class="v">${brl(fat)}</div></div>
   <div class="stat"><div class="mut sm">Pedidos</div><div class="v">${ok.length}</div><div class="mut sm">${canc} cancelado(s)</div></div>
   <div class="stat"><div class="mut sm">Ticket médio</div><div class="v">${brl(ok.length?fat/ok.length:0)}</div></div>
   <div class="stat"><div class="mut sm">Taxas de entrega</div><div class="v">${brl(tx)}</div><div class="mut sm">${ent} entrega(s) · ${ok.length-ent} retirada(s)</div></div>
   <div class="stat"><div class="mut sm">Produtos</div><div class="v">${brl(sub)}</div></div>
   <div class="stat"><div class="mut sm">Custo dos produtos</div><div class="v">${brl(cmv)}</div></div>
   <div class="stat"><div class="mut sm">Lucro bruto</div><div class="v" style="color:${lucro<0?'var(--al)':'var(--ok)'}">${brl(lucro)}</div><div class="mut sm">margem ${sub?Math.round(lucro/sub*100):0}%</div></div>
   <div class="stat"><div class="mut sm">Não marcado como pago</div><div class="v" style="color:${aReceber?'var(--al)':'inherit'}">${brl(aReceber)}</div></div></div>
  ${temCusto?'':'<div class="card mut sm">💡 Cadastre o preço de custo dos produtos na aba 📦 Estoque para ver o lucro.</div>'}
  <div class="card"><h4>Por forma de pagamento</h4><table>${Object.entries(pf).map(([k,v])=>`<tr><td>${FORMAS[k]||k}</td><td class="r">${v.n}</td><td class="r">${brl(v.v)}</td></tr>`).join('')||'<tr><td class="mut">Sem vendas</td></tr>'}</table></div>
  <div class="card"><h4>Mais vendidos</h4><table><tr><th>Item</th><th class="r">Qtd</th><th class="r">Total</th><th class="r">Lucro</th></tr>${top.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.q}</td><td class="r">${brl(v.v)}</td><td class="r">${v.c?brl(v.v-v.c):'—'}</td></tr>`).join('')}</table><p class="mut sm" style="margin-top:6px">Lucro calculado com o custo cadastrado hoje. A taxa de entrega não entra no lucro dos produtos.</p></div>
  ${Object.keys(pd).length>1?`<div class="card"><h4>Por dia</h4><table>${Object.entries(pd).map(([k,v])=>`<tr><td>${k}</td><td class="r">${v.n} ped.</td><td class="r">${brl(v.v)}</td></tr>`).join('')}</table></div>`:''}
  <button class="btn big" onclick="baixarCSV()">⬇️ Baixar planilha (CSV)</button>`;
}
function baixarCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',n=v=>String((+v||0).toFixed(2)).replace('.',',');
  const L=[['Numero','Data','Hora','Cliente','Telefone','Tipo','Endereco','Itens','Subtotal','Taxa','Total','Pagamento','Pago','Status'].join(';')];
  relCache.forEach(p=>{const c=p.cliente||{},d=new Date(p.criadoMs);L.push([p.numero,d.toLocaleDateString('pt-BR'),hora(p.criadoMs),q(c.nome),q(c.tel),p.tipo,q(endTxt(c)),q((p.itens||[]).map(i=>i.qtd+'x '+i.nome+(i.variacao?' ('+i.variacao+')':'')+((i.escolhas||[]).length?' ['+fmtEscolhas(i)+']':'')).join(', ')),n(p.subtotal),n(p.taxa),n(p.total),q(((FORMAS[(p.pagamento||{}).forma]||'').replace(/^\S+ /,''))),p.pago?'Sim':'Nao',stLabel(p)].join(';'))});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+L.join('\n')],{type:'text/csv;charset=utf-8'}));a.download=`pedidos_${lojaId}_${relDe}_a_${relAte}.csv`;a.click();
}

  try{
    const nova=await criarLogin(email,senha);
    try{await db.collection(USERS).doc(email).set({marmitaId:lojaId,nome,papel,criadoMs:Date.now()})}
    catch(e){return toast('Este e-mail já está vinculado a uma marmitaria')}
    ['eqNome','eqEmail','eqSenha'].forEach(i=>$('#'+i).value='');
    toast((papel==='entregador'?'Entregador':'Funcionário')+(nova?' adicionado. Passe o e-mail e a senha para ele.':' adicionado (já tinha login: usa a senha que já tem).'));
    carregarEquipe();
  }catch(e){toast('Erro: '+(e.code==='auth/weak-password'?'senha fraca':e.message))}
}
async function remFunc(email){if(!confirm('Remover o acesso desta pessoa?'))return;try{await db.collection(USERS).doc(email).delete();carregarEquipe()}catch(e){toast('Erro: '+e.message)}}

// ---------- Suporte (somente o administrador escolhe qual painel abrir; cadastro fica no Administrador Apps) ----------
async function renderAdmin(){
  const el=$('#t-admin');if(!isSuper){el.innerHTML='';return}
  el.innerHTML=`<div class="card"><h4>🛡️ Acesso de suporte</h4><p class="mut sm">Cadastro, mensalidade e suspensão das marmitarias ficam no <b>Administrador Apps</b>. Aqui você só escolhe qual painel abrir.</p></div><div id="admList"><p class="vazio">Carregando…</p></div>`;
  try{const q=await db.collection('marmitarias').get();
    $('#admList').innerHTML=q.docs.sort((a,b)=>String(a.data().nome).localeCompare(b.data().nome)).map(d=>{const m=d.data();return `<div class="pr-row" onclick="entrarLoja('${esc(d.id)}')"><div style="flex:1;min-width:0"><b>${esc(m.nome)}</b><div class="mut sm">${esc(d.id)} · ${esc(m.donoEmail||'')}${d.id===lojaId?' · <b>aberta agora</b>':''}</div></div><span class="tag ${m.status==='ativo'?'pago':'t-cancelado'}">${m.status==='ativo'?'Ativa':'Suspensa'}</span></div>`}).join('')||'<p class="vazio">Nenhuma marmitaria. Crie pelo Administrador Apps.</p>'}
  catch(e){$('#admList').innerHTML='<p class="vazio">Erro: '+esc(e.message)+'</p>'}
}
function entrarLoja(id){localStorage.setItem('mm_super_loja',id);history.replaceState(null,'',location.pathname+'?m='+encodeURIComponent(id));abrirLoja(id)}
